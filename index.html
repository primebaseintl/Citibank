<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Naija Drive</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #14110f; overscroll-behavior: none; touch-action: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  button { font-family: inherit; }
  #err { display: none; position: fixed; inset: 0; padding: 40px; font-size: 20px; background: #14110f; z-index: 50; }

  /* ---------- HUD ---------- */
  #hud { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  body[data-mode="drive"] #hud { display: block; }
  .pill { position: absolute; background: rgba(20,17,15,.62); backdrop-filter: blur(6px); border-radius: 12px; padding: 8px 14px;
    font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .pill small { font-size: 13px; font-weight: 500; opacity: .7; }
  .two { display: flex; flex-direction: column; line-height: 1.15; }
  .two b { max-width: 36vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .two small { display: block; max-width: 36vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topL { left: 14px; top: calc(14px + env(safe-area-inset-top)); }
  #topR { right: 14px; top: calc(14px + env(safe-area-inset-top)); }
  #net { left: 14px; top: calc(70px + env(safe-area-inset-top)); font-size: 13px; font-weight: 500; padding: 5px 10px; display: none; }
  #clock { position: absolute; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%);
    font-size: 36px; font-weight: 700; letter-spacing: -.03em; text-shadow: 0 2px 10px rgba(0,0,0,.55); display: none; }
  #clock.low { color: #ff9a7a; }
  #goal { position: absolute; left: 50%; top: calc(58px + env(safe-area-inset-top)); transform: translateX(-50%); display: none;
    align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; white-space: nowrap;
    background: rgba(20,17,15,.55); backdrop-filter: blur(6px); font-size: 15px; font-weight: 500; }
  #arrow { flex: none; transition: transform .08s linear; }
  #util { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
  #util button { border: 0; border-radius: 10px; padding: 8px 12px; background: rgba(20,17,15,.55); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
  #toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%) translateY(6px); opacity: 0; transition: opacity .25s, transform .25s;
    padding: 10px 16px; border-radius: 12px; background: rgba(20,17,15,.72); backdrop-filter: blur(6px); font-size: 17px; font-weight: 700; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #count { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 120px; font-weight: 700; letter-spacing: -.04em;
    text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  #keyhelp { position: absolute; left: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); font-size: 13px; opacity: .75; text-shadow: 0 1px 6px rgba(0,0,0,.7); max-width: 28vw; }
  @media (hover: none) { #keyhelp { display: none; } }
  @media (max-width: 600px) { #clock { font-size: 30px; } #util button { padding: 7px 9px; font-size: 12px; } }

  /* ---------- touch pedals ---------- */
  #pad { display: none; position: fixed; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom)); z-index: 6;
    justify-content: space-between; align-items: flex-end; padding: 0 14px; pointer-events: none; }
  @media (hover: none) { body[data-mode="drive"] #pad { display: flex; } }
  .cluster { display: flex; gap: 10px; align-items: flex-end; }
  .pb { pointer-events: auto; touch-action: none; border: 0; border-radius: 22px; width: 78px; height: 78px; color: #fff; font-size: 16px; font-weight: 700;
    background: rgba(20,17,15,.55); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; }
  .pb.big { width: 92px; height: 110px; background: rgba(201,162,74,.78); color: #14110f; box-shadow: none; }
  .pb.sm { width: 64px; height: 50px; border-radius: 16px; font-size: 14px; }
  .pb.down { transform: scale(.94); background: rgba(240,207,122,.9); color: #14110f; }
  .stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .row { display: flex; gap: 10px; }

  /* ---------- cards ---------- */
  #card { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 20px;
    background: rgba(20,17,15,.5); backdrop-filter: blur(3px); }
  #card.on { display: flex; }
  .panel { width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    padding: 28px 24px 24px; border-radius: 20px; background: rgba(31,58,64,.95);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 0 0 2px rgba(201,162,74,.55); }
  .panel h1 { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -.035em; margin-bottom: 14px; color: #f6e3ae; }
  .panel p { font-size: 17px; line-height: 1.45; opacity: .9; margin-bottom: 14px; }
  .panel p.sub { font-size: 14px; opacity: .65; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 4px 0 18px; font-size: 17px; }
  .stats dt { opacity: .75; } .stats dd { font-weight: 700; text-align: right; }
  .stats .total { grid-column: 1 / -1; display: flex; justify-content: space-between; padding-top: 10px; margin-top: 4px; border-top: 1px solid rgba(255,255,255,.2); font-size: 22px; font-weight: 700; color: #f6e3ae; }
  .btn { display: block; width: 100%; min-height: 54px; margin-top: 10px; border-radius: 14px; border: 2px solid rgba(255,255,255,.35);
    background: transparent; color: #fff; font-size: 18px; font-weight: 700; padding: 0 16px; cursor: pointer; }
  .btn.primary { background: #c9a24a; border-color: #c9a24a; color: #14110f; }
  .btn.opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 50px; font-size: 17px; text-align: left; }
  .btn.opt small { font-weight: 500; opacity: .7; font-size: 14px; white-space: nowrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .grid2 .btn.opt { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 14px; }
  .btn:focus-visible, #util button:focus-visible { outline: 3px solid #f0cf7a; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #toast, #arrow { transition: none; } }
</style>
</head>
<body data-mode="menu">
<div id="app"></div>

<div id="hud">
  <div class="pill" id="topL"><span class="two"><b id="where">Ikeja</b><small id="road"></small></span></div>
  <div id="clock">0:00</div>
  <div class="pill" id="topR"><b id="spd">0</b><small>km/h</small></div>
  <div id="goal">
    <svg id="arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 L20 21 L12 16 L4 21 Z" fill="#f0cf7a"/></svg>
    <span id="goalTxt"></span>
  </div>
  <div class="pill" id="net">Loading map</div>
  <div id="toast"></div>
  <div id="count"></div>
  <div id="keyhelp">W A S D or arrow keys to drive, Space to drift, Shift for turbo, T to get back on the road, R to restart</div>
  <div id="util"><button id="snd">Sound on</button><button id="respB">Back on road</button><button id="restartB">Restart</button><button id="menuB">Menu</button></div>
</div>

<div id="pad">
  <div class="cluster">
    <button class="pb" data-k="left" aria-label="Steer left"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M16 3 L6 12 L16 21 Z" fill="currentColor"/></svg></button>
    <button class="pb" data-k="right" aria-label="Steer right"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 3 L18 12 L8 21 Z" fill="currentColor"/></svg></button>
  </div>
  <div class="cluster">
    <div class="stack">
      <div class="row"><button class="pb sm" data-k="turbo">Turbo</button><button class="pb sm" data-k="hand">Drift</button></div>
      <button class="pb" data-k="brake">Brake</button>
    </div>
    <button class="pb big" data-k="gas">Gas</button>
  </div>
</div>

<div id="card"><div class="panel" id="panel"></div></div>
<div id="err">The 3D library could not load. Check your internet connection and reload the page.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'block'; return; }

let booted = false;
function boot() { if (booted) return; booted = true; start(); }
if (document.fonts && document.fonts.load) {
  Promise.race([
    document.fonts.load('700 48px "Bricolage Grotesque"'),
    new Promise(r => setTimeout(r, 1500))
  ]).then(boot, boot);
} else boot();

function start() {
const T = THREE;

/* ============ utilities ============ */
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rng32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ============ map projection ============
   World x grows east, world z grows south (so north is -z).
   Car heading h: the car's front points along (cos h, -sin h) on the (x, z) plane. Turning left makes h grow. */
const LAT0 = 6.6018, LON0 = 3.3515, KZ = 110574, KX = 111320 * Math.cos(LAT0 * Math.PI / 180);
const toX = lon => (lon - LON0) * KX, toZ = lat => -(lat - LAT0) * KZ;
const toLon = x => LON0 + x / KX, toLat = z => LAT0 - z / KZ;
const TS = 0.02;                         /* tile size in degrees, about 2.2 km */
const tkey = (ix, iy) => ix * 1000 + iy;
const CELL = 24;                         /* spatial hash cell in metres, tile-local */
const CK = 200003;

/* ============ places and runs ============ */
const CITIES = [
  { id: 'ikeja', name: 'Lagos (Ikeja)', lat: 6.6018, lon: 3.3515 },
  { id: 'vi', name: 'Victoria Island', lat: 6.4281, lon: 3.4219 },
  { id: 'lekki', name: 'Lekki', lat: 6.4698, lon: 3.5852 },
  { id: 'ikorodu', name: 'Ikorodu', lat: 6.6194, lon: 3.5105 },
  { id: 'badagry', name: 'Badagry', lat: 6.4156, lon: 2.8810 },
  { id: 'sagamu', name: 'Sagamu', lat: 6.8485, lon: 3.6470 },
  { id: 'abeokuta', name: 'Abeokuta', lat: 7.1475, lon: 3.3619 },
  { id: 'ibadan', name: 'Ibadan', lat: 7.3775, lon: 3.9470 },
  { id: 'ilorin', name: 'Ilorin', lat: 8.4966, lon: 4.5421 },
  { id: 'benin', name: 'Benin City', lat: 6.3350, lon: 5.6037 },
  { id: 'warri', name: 'Warri', lat: 5.5160, lon: 5.7500 },
  { id: 'onitsha', name: 'Onitsha', lat: 6.1410, lon: 6.7870 },
  { id: 'enugu', name: 'Enugu', lat: 6.4584, lon: 7.5464 },
  { id: 'owerri', name: 'Owerri', lat: 5.4836, lon: 7.0333 },
  { id: 'ph', name: 'Port Harcourt', lat: 4.8156, lon: 7.0498 },
  { id: 'calabar', name: 'Calabar', lat: 4.9757, lon: 8.3417 },
  { id: 'abuja', name: 'Abuja', lat: 9.0765, lon: 7.3986 },
  { id: 'kaduna', name: 'Kaduna', lat: 10.5105, lon: 7.4165 },
  { id: 'jos', name: 'Jos', lat: 9.8965, lon: 8.8583 },
  { id: 'kano', name: 'Kano', lat: 12.0022, lon: 8.5920 }
];
const city = id => CITIES.find(c => c.id === id);
const gdist = (a, b) => Math.hypot((b.lon - a.lon) * KX, (b.lat - a.lat) * KZ);
const RUNS = [
  ['ikeja', 'vi', 'Ikeja to Victoria Island'], ['vi', 'lekki', 'Victoria Island to Lekki'], ['ikeja', 'ikorodu', 'Ikeja to Ikorodu'],
  ['ikeja', 'badagry', 'Ikeja to Badagry'], ['ikeja', 'sagamu', 'Ikeja to Sagamu'], ['ikeja', 'abeokuta', 'Ikeja to Abeokuta'],
  ['ikeja', 'ibadan', 'Lagos to Ibadan'], ['ph', 'owerri', 'Port Harcourt to Owerri'], ['enugu', 'onitsha', 'Enugu to Onitsha'],
  ['benin', 'warri', 'Benin City to Warri'], ['abuja', 'kaduna', 'Abuja to Kaduna']
].map(r => ({ id: r[0] + '-' + r[1], from: city(r[0]), to: city(r[1]), name: r[2] }));
const runLimit = r => 40 + gdist(r.from, r.to) / 22;

/* ============ game state ============ */
const G = { mode: 'menu', phase: 'idle', run: null, last: null, live: false, time: 0, dist0: 0, cd: 0, shake: 0, bumps: 0, win: false, loadT: 0, whereT: 0 };

/* ============ renderer, scene, camera ============ */
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
$('app').appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.Fog(0xd8d3c2, 260, 1500);
const camera = new T.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 3000);
const baseFov = () => camera.aspect < 1 ? 78 : 62;
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = baseFov();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fitCamera();
addEventListener('resize', fitCamera);

scene.add(new T.HemisphereLight(0xdbe8ff, 0x6a5a40, 0.95));
const sunL = new T.DirectionalLight(0xfff0d0, 0.85);
sunL.position.set(200, 300, 120);
scene.add(sunL);

/* ============ helpers ============ */
function makeTex(w, h, draw, clampEdge) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  if (clampEdge) { t.wrapS = t.wrapT = T.ClampToEdgeWrapping; t.generateMipmaps = false; t.minFilter = T.LinearFilter; }
  else { t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
  return t;
}
const std = (color, rough = 0.85, metal = 0) => new T.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
const glow = color => new T.MeshBasicMaterial({ color });
function box(w, h, d, mat, x, y, z, parent) { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; }
function cyl(rt, rb, h, mat, x, y, z, parent, seg) { const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 16), mat); m.position.set(x, y, z); parent.add(m); return m; }
function plane(w, h, mat, x, y, z, rx, parent) { const m = new T.Mesh(new T.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.x = rx || 0; parent.add(m); return m; }

/* ============ sky and ground ============ */
const skyTex = makeTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  [[0, '#3a74bb'], [0.3, '#7fb0dc'], [0.46, '#cfd7d4'], [0.5, '#d8d3c2'], [1, '#d8d3c2']].forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}, true);
const sky = new T.Mesh(new T.SphereGeometry(2500, 24, 12), new T.MeshBasicMaterial({ map: skyTex, side: T.BackSide, fog: false, depthWrite: false }));
scene.add(sky);

const groundTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#d9d9d9'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2200; i++) { g.fillStyle = 'rgba(' + (rand() < 0.5 ? '0,0,0' : '255,255,255') + ',' + (0.04 + rand() * 0.08) + ')'; g.fillRect(rand() * w, rand() * h, 2, 2); }
});
const GSIZE = 8000, GPER = 10;
groundTex.repeat.set(GSIZE / GPER, GSIZE / GPER);
const groundMat = new T.MeshBasicMaterial({ map: groundTex, color: 0x6f8f4a });
const ground = new T.Mesh(new T.PlaneGeometry(GSIZE, GSIZE), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02;
scene.add(ground);
const cGreen = new T.Color(0x6f8f4a), cDry = new T.Color(0xb9a46b), cTmp = new T.Color();

/* ============ OpenStreetMap tiles ============ */
const CLS = { motorway: 0, motorway_link: 1, trunk: 2, trunk_link: 3, primary: 4, primary_link: 5, secondary: 6, secondary_link: 7, tertiary: 8, tertiary_link: 9, unclassified: 10, residential: 11, living_street: 12 };
const RD = [
  { w: 13, m: 1 }, { w: 7, m: 1 }, { w: 11, m: 1, l: 1 }, { w: 7, m: 1 }, { w: 10, m: 1, l: 1 }, { w: 7, m: 1 }, { w: 9, m: 1, l: 1 }, { w: 7, m: 1 },
  { w: 8, m: 0 }, { w: 6, m: 0 }, { w: 6.5, m: 0 }, { w: 6, m: 0 }, { w: 5, m: 0 }
];
const UNP = new Set(['unpaved', 'dirt', 'sand', 'ground', 'gravel', 'compacted', 'earth', 'mud', 'grass', 'fine_gravel', 'dirt/sand']);
const lc = hex => new T.Color(hex);
const ROAD_COL = { majorP: lc(0x3a3d44), minorP: lc(0x4b4e55), majorU: lc(0xa08058), minorU: lc(0xa88a60), line: lc(0xe8d27a) };

const MIRRORS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
let mirrorI = 0;
function tileQuery(S, W, N, E) {
  const b = '(' + S + ',' + W + ',' + N + ',' + E + ')';
  return '[out:json][timeout:25];(' +
    'way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"]' + b + ';' +
    'node["place"~"^(city|town|village|suburb|neighbourhood|hamlet)$"]' + b + ';' +
    'node["tourism"~"^(attraction|viewpoint|museum|theme_park|zoo)$"]["name"]' + b + ';' +
    'node["natural"="peak"]["name"]' + b + ';' +
    'node["historic"]["name"]' + b + ';' +
    'node["aeroway"="terminal"]["name"]' + b + ';' +
    ');out geom;';
}
async function fetchTile(ix, iy) {
  const S = +(iy * TS).toFixed(5), W = +(ix * TS).toFixed(5), N = +((iy + 1) * TS).toFixed(5), E = +((ix + 1) * TS).toFixed(5);
  const q = tileQuery(S, W, N, E);
  for (let a = 0; a < MIRRORS.length * 2; a++) {
    const url = MIRRORS[(mirrorI + a) % MIRRORS.length];
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const to = setTimeout(() => { if (ctl) ctl.abort(); }, 30000);
    try {
      const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl ? ctl.signal : undefined });
      clearTimeout(to);
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      mirrorI = (mirrorI + a) % MIRRORS.length;
      return j;
    } catch (e) { clearTimeout(to); await sleep(500 * (a + 1)); }
  }
  throw new Error('overpass unavailable');
}
function compact(j) {
  const ways = [], places = [];
  for (const e of (j.elements || [])) {
    const t = e.tags; if (!t) continue;
    if (e.type === 'way' && e.geometry && t.highway) {
      const c = CLS[t.highway]; if (c === undefined) continue;
      const g = e.geometry, p = [];
      for (let i = 0; i < g.length; i++) { if (!g[i]) continue; p.push(g[i].lat, g[i].lon); }
      if (p.length < 4) continue;
      ways.push([c, t.name || t.ref || '', UNP.has(t.surface) ? 1 : 0, p, t.oneway === 'yes' ? 1 : 0]);
    } else if (e.type === 'node' && t.name && e.lat !== undefined) {
      let k = null;
      if (t.place) k = t.place === 'city' ? 'city' : t.place === 'town' ? 'town' : (t.place === 'suburb') ? 'suburb' : t.place === 'neighbourhood' ? 'hood' : 'village';
      else if (t.tourism || t.historic || t.natural === 'peak' || t.aeroway) k = 'mark';
      if (k) places.push([t.name, k, e.lat, e.lon]);
    }
  }
  return { v: 1, ways, places };
}

/* small IndexedDB cache so a tile is only downloaded once */
let idb = null;
const idbReady = new Promise(res => {
  try {
    const r = indexedDB.open('naijadrive', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('t');
    r.onsuccess = () => { idb = r.result; res(); };
    r.onerror = () => res(); r.onblocked = () => res();
  } catch (e) { res(); }

/* ============ input ============ */
const kb = { left: 0, right: 0, gas: 0, brake: 0, hand: 0, turbo: 0 };
const pad = { left: 0, right: 0, gas: 0, brake: 0, hand: 0, turbo: 0 };
const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake', Space: 'hand', ShiftLeft: 'turbo', ShiftRight: 'turbo' };
addEventListener('keydown', e => {
  if (G.mode !== 'drive') return;
  const k = keyMap[e.code];
  if (k) { kb[k] = 1; e.preventDefault(); }
  if (e.code === 'KeyR') restart();
  if (e.code === 'KeyT') respawn();
  if (e.code === 'Escape') showMenu();
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) kb[k] = 0; });
addEventListener('blur', () => { Object.keys(kb).forEach(k => { kb[k] = 0; pad[k] = 0; }); });
document.querySelectorAll('.pb').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); pad[k] = 1; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { pad[k] = 0; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ============ sound ============ */
let audio = null, muted = false;
function initAudio() {
  if (audio) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 50;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const gain = ctx.createGain(); gain.gain.value = 0;
    osc.connect(lp); lp.connect(gain); gain.connect(ctx.destination); osc.start();
    audio = { ctx, osc, gain };
  } catch (e) { audio = null; }
}
function blip(f, d, type, vol, f2) {
  if (!audio || muted) return;
  const c = audio.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
}
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.3, 'triangle', 0.12), i * 110));
$('snd').addEventListener('click', () => { muted = !muted; $('snd').textContent = muted ? 'Sound off' : 'Sound on'; });

/* ============ HUD, cards ============ */
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600); }
const fmtT = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60; return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0') : m + ':' + String(sec).padStart(2, '0'); };
const fmtKm = m => (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';

const card = $('card'), panel = $('panel');
function mkBtn(b) {
  const el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' primary' : '') + (b.sub ? ' opt' : '');
  if (b.sub) { const s1 = document.createElement('span'), s2 = document.createElement('small'); s1.textContent = b.label; s2.textContent = b.sub; el.appendChild(s1); el.appendChild(s2); }
  else el.textContent = b.label;
  el.addEventListener('click', b.fn); return el;
}
function showCard(html, items) {
  panel.innerHTML = html;
  items.forEach(it => {
    if (it.grid) { const w = document.createElement('div'); w.className = 'grid2'; it.grid.forEach(b => w.appendChild(mkBtn(b))); panel.appendChild(w); }
    else panel.appendChild(mkBtn(it));
  });
  card.classList.add('on'); panel.scrollTop = 0;
  const f = panel.querySelector('.btn'); if (f) f.focus({ preventScroll: true });
}
const hideCard = () => card.classList.remove('on');

function setMode(m) {
  G.mode = m; document.body.dataset.mode = m;
  if (m !== 'drive' && audio) audio.gain.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.05);
  fitCamera();
}
function showMenu() {
  setMode('menu');
  const items = [];
  if (G.live) items.push({ label: 'Continue', primary: true, fn: () => { hideCard(); setMode('drive'); } });
  items.push({ label: 'Free roam', primary: !G.live, fn: showRoamPicker });
  items.push({ label: 'Delivery runs', fn: showRunPicker });
  showCard('<h1>Naija Drive</h1><p>Drive real Nigerian roads, streamed live from OpenStreetMap. Roam anywhere, or race the clock on a delivery run.</p><p class="sub">Roads, towns and landmarks are real. The first visit to an area downloads it, then it is saved on your device.</p>', items);
}
function showRoamPicker() {
  showCard('<h1>Where to?</h1><p>Pick a city to start roaming from.</p>',
    [{ grid: CITIES.map(c => ({ label: c.name, sub: '', fn: () => startRoam(c) })).map(b => { b.sub = ' '; return b; }) }, { label: 'Back', fn: showMenu }]);
}
function showRunPicker() {
  showCard('<h1>Delivery runs</h1><p>Drive from the start to the destination before the clock runs out. Follow the arrow and the gold beam.</p>',
    RUNS.map(r => ({ label: r.name, sub: fmtKm(gdist(r.from, r.to)) + ' · ' + fmtT(runLimit(r)), fn: () => startRun(r) })).concat([{ label: 'Back', fn: showMenu }]));
}
$('menuB').addEventListener('click', showMenu);
$('restartB').addEventListener('click', () => restart());
$('respB').addEventListener('click', () => respawn());

/* ============ sessions ============ */
let camH = 0, camSeeded = false;
function beginSession(o) {
  initAudio(); if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
  G.last = o; G.run = o.run || null; G.bumps = 0; G.win = false; G.shake = 0; G.live = true; G.loadT = 0;
  Object.assign(player, { x: toX(o.lon), z: toZ(o.lat), h: Math.PI / 2, vx: 0, vz: 0, fv: 0, steer: 0, bumpCd: 0 });
  if (G.run) {
    dest.x = toX(G.run.to.lon); dest.z = toZ(G.run.to.lat);
    destBeam.position.set(dest.x, 450, dest.z); destBeam.visible = true;
    G.dist0 = Math.hypot(dest.x - player.x, dest.z - player.z); G.time = runLimit(G.run);
    player.h = Math.atan2(-(dest.z - player.z), dest.x - player.x);
  } else destBeam.visible = false;
  camH = player.h; camSeeded = false;
  G.phase = 'load';
  showCard('<h1>Loading map</h1><p id="lm">Fetching roads and places around ' + (o.name || 'the start') + '.</p>', [{ label: 'Back to menu', fn: showMenu }]);
  setMode('drive');
}
function startRoam(c) { beginSession({ lat: c.lat, lon: c.lon, name: c.name, run: null }); }
function startRun(r) { beginSession({ lat: r.from.lat, lon: r.from.lon, name: r.from.name, run: r }); }
function restart() { if (G.last) beginSession(G.last); }
function respawn() {
  if (G.phase === 'load') return;
  const r = nearestRoad(player.x, player.z, 400);
  if (!r) { toast('No road nearby'); return; }
  player.x = r.px; player.z = r.pz;
  let h = Math.atan2(-r.tz, r.tx); if (Math.cos(h - player.h) < 0) h += Math.PI;
  player.h = h; player.vx = player.vz = player.fv = 0; camH = h; toast('Back on the road');
}
function endRun(win) {
  G.phase = 'over'; G.win = win;
  const left = Math.max(0, G.time), r = G.run;
  const score = Math.max(0, win ? Math.round(left) * 10 + Math.round(G.dist0 / 10) - G.bumps * 50 : 0);
  let best = 0, bk = 'naijaBest_' + r.id; try { best = +localStorage.getItem(bk) || 0; } catch (e) {}
  const isBest = win && score > best;
  if (isBest) { try { localStorage.setItem(bk, String(score)); } catch (e) {} best = score; }
  if (win) fanfare(); else blip(220, 0.5, 'sawtooth', 0.12, 80);
  const html = '<h1>' + (win ? 'Delivered' : 'Out of time') + '</h1>' +
    '<p>' + (win ? 'You made it to ' + r.to.name + '.' : 'The clock ran out before ' + r.to.name + '. Try a faster line, and hold Turbo on the highways.') + '</p>' +
    '<dl class="stats"><dt>Time left</dt><dd>' + fmtT(left) + '</dd><dt>Bumps</dt><dd>' + G.bumps + '</dd>' +
    '<div class="total"><span>' + (isBest ? 'New best' : 'Score') + '</span><span>' + score.toLocaleString() + '</span></div>' +
    (isBest || !best ? '' : '<dt>Best</dt><dd>' + best.toLocaleString() + '</dd>') + '</dl>';
  showCard(html, [{ label: 'Play again', primary: true, fn: restart }, { label: 'Free roam from here', fn: () => { G.run = null; destBeam.visible = false; G.last = { lat: toLat(player.z), lon: toLon(player.x), name: 'here', run: null }; G.phase = 'play'; hideCard(); } }, { label: 'Menu', fn: () => { G.live = false; showMenu(); } }]);
}

/* ============ collisions ============ */
function bump(impact) {
  if (impact < 3.5) return;
  G.shake = Math.min(1, impact / 12);
  if (G.phase !== 'play' || player.bumpCd > 0) return;
  player.bumpCd = 0.9; blip(120, 0.25, 'square', 0.12, 40);
  if (G.run) { G.bumps++; G.time -= 2; toast('Bump, minus 2 seconds'); }
}
function resolve(ox, oz, orad) {
  const c = Math.cos(player.h), s = -Math.sin(player.h);
  [1.25, -1.25].forEach(off => {
    const cx = player.x + c * off, cz = player.z + s * off;
    let dx = cx - ox, dz = cz - oz, d = Math.hypot(dx, dz); const min = 1.0 + orad;
    if (d >= min) return;
    if (d < 1e-4) { dx = 1; dz = 0; d = 1; }
    const nx = dx / d, nz = dz / d, pen = min - d;
    player.x += nx * pen; player.z += nz * pen;
    const vn = player.vx * nx + player.vz * nz;
    if (vn < 0) { player.vx -= 1.3 * vn * nx; player.vz -= 1.3 * vn * nz; bump(-vn); }
  });
}
function collideAll() {
  const ts = nearTiles(player.x, player.z);
  for (const t of ts) {
    const lx = player.x - t.ox, lz = player.z - t.oz, cx = Math.floor(lx / CELL), cz = Math.floor(lz / CELL), O = t.obs;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const l = t.ogrid.get((cx + a) * CK + cz + b); if (!l) continue;
      for (let i = 0; i < l.length; i++) resolve(O[l[i] * 3] + t.ox, O[l[i] * 3 + 1] + t.oz, O[l[i] * 3 + 2]);
    }
  }
}

/* ============ driving step ============ */
const VMAX = 33, VTURBO = 70;
function updateDrive(dt) {
  const p = player; let inp = { l: 0, r: 0, gas: 0, brake: 0, hand: 0, turbo: 0 };
  const centre = tileAt(p.x, p.z), ready = !!(centre && centre.state === 'ready');
  const rq = ready ? queryRoad(p.x, p.z) : null;
  const onRoad = !!rq && rq.sd < 0.4;

  if (G.phase === 'load') {
    G.loadT += dt;
    if (ready) {
      const r = nearestRoad(p.x, p.z, 500);
      if (r) {
        p.x = r.px; p.z = r.pz;
        let h = Math.atan2(-r.tz, r.tx);
        const want = G.run ? Math.atan2(-(dest.z - p.z), dest.x - p.x) : p.h;
        if (Math.cos(h - want) < 0) h += Math.PI;
        p.h = h; camH = h;
      }
      hideCard();
      if (G.run) { G.phase = 'count'; G.cd = 3.4; } else G.phase = 'play';
    } else {
      const lm = $('lm');
      if (lm && G.loadT > 12) lm.textContent = netErr ? 'The map server is not responding. Check your connection, it will keep retrying.' : 'Still downloading the map. The first visit to an area takes a moment.';
    }
  } else if (G.phase === 'count') {
    G.cd -= dt;
    $('count').textContent = G.cd > 2.4 ? '3' : G.cd > 1.4 ? '2' : G.cd > 0.4 ? '1' : 'Go';
    if (G.cd <= 0.4) { G.phase = 'play'; }
  } else if (G.phase === 'play') {
    if (G.run && G.cd > -0.5) { G.cd -= dt; $('count').textContent = 'Go'; } else $('count').textContent = '';
    inp = { l: kb.left || pad.left, r: kb.right || pad.right, gas: kb.gas || pad.gas, brake: kb.brake || pad.brake, hand: kb.hand || pad.hand, turbo: kb.turbo || pad.turbo };
    if (G.run) {
      G.time -= dt;
      if (Math.hypot(dest.x - p.x, dest.z - p.z) < 60) endRun(true);
      else if (G.time <= 0) { G.time = 0; endRun(false); }
    }
  } else { $('count').textContent = ''; }

  if (G.phase !== 'load') {
    p.bumpCd = Math.max(0, p.bumpCd - dt);
    const steerTarget = (inp.l ? 1 : 0) - (inp.r ? 1 : 0);
    p.steer += (steerTarget - p.steer) * (1 - Math.exp(-dt * 9));
    p.h += p.steer * (2.1 / (1 + Math.abs(p.fv) / 14)) * clamp(p.fv / 4, -1, 1) * (inp.hand ? 1.5 : 1) * dt;
    const c = Math.cos(p.h), s = -Math.sin(p.h);
    let fv = p.vx * c + p.vz * s, lv = -p.vx * s + p.vz * c;
    const VM = (inp.turbo ? VTURBO : VMAX) * (onRoad || !ready ? 1 : 0.5);
    if (inp.gas) fv += (inp.turbo ? 24 : 14) * (1 - clamp(fv / VM, 0, 1)) * dt;
    if (fv > VM) fv -= Math.min(fv - VM, (onRoad ? 5 : 14) * dt);
    if (inp.brake) { if (fv > 0.5) fv -= 28 * dt; else fv -= 8 * (1 - clamp(-fv / 8, 0, 1)) * dt; }
    if (!inp.gas && !inp.brake) fv -= Math.sign(fv) * Math.min(Math.abs(fv), 3.5 * dt);
    if (inp.hand) fv -= Math.sign(fv) * Math.min(Math.abs(fv), 9 * dt);
    fv -= fv * 0.03 * dt;
    lv *= Math.exp(-(inp.hand ? 1.4 : 7.5) * dt);
    p.vx = c * fv - s * lv; p.vz = s * fv + c * lv; p.fv = fv;
    p.x += p.vx * dt; p.z += p.vz * dt;
    if (ready) collideAll();
    if (ready && !onRoad && Math.abs(fv) > 10) G.shake = Math.max(G.shake, 0.08);
  }

  /* HUD */
  const speed = Math.hypot(p.vx, p.vz);
  $('spd').textContent = Math.round(speed * 3.6);
  G.whereT -= dt;
  if (G.whereT <= 0) {
    G.whereT = 0.4;
    let bn = '', bd = 9e12;
    for (const t of tiles.values()) { if (t.state !== 'ready' || !t.pl) continue; for (const q of t.pl) { const d = (q.x - p.x) * (q.x - p.x) + (q.z - p.z) * (q.z - p.z); if (d < bd) { bd = d; bn = q.name; } } }
    $('where').textContent = bd < 4e6 ? bn : 'Open country';
    $('road').textContent = !ready ? 'Loading map' : onRoad ? (rq.name || 'Unnamed road') : 'Off road';
  }
  const net = $('net');
  if (activeLoads > 0 || netErr) { net.style.display = 'flex'; net.textContent = netErr ? 'Map server busy, retrying' : 'Loading map'; } else net.style.display = 'none';
  const clock = $('clock'), goal = $('goal');
  if (G.run) {
    clock.style.display = 'block'; clock.textContent = fmtT(G.time); clock.classList.toggle('low', G.time < 30 && G.phase === 'play');
    goal.style.display = 'flex';
    const dd = Math.hypot(dest.x - p.x, dest.z - p.z);
    $('goalTxt').textContent = G.run.to.name + ', ' + fmtKm(dd);
    $('arrow').style.transform = 'rotate(' + (-wrapA(Math.atan2(-(dest.z - p.z), dest.x - p.x) - p.h) * 180 / Math.PI) + 'deg)';
  } else { clock.style.display = 'none'; goal.style.display = 'none'; }

  /* car, sound */
  placeCar(p.car, p.x, p.z, p.h, p.fv, dt, !!inp.brake && p.fv > 0.5);
  if (audio) {
    const now = audio.ctx.currentTime;
    audio.osc.frequency.setTargetAtTime(48 + Math.min(speed, 40) * 5.2 + (inp.gas ? 14 : 0) + (inp.turbo ? 20 : 0), now, 0.06);
    audio.gain.gain.setTargetAtTime(muted || G.phase === 'over' || G.phase === 'load' ? 0 : 0.045 + (inp.gas ? 0.025 : 0), now, 0.08);
  }

  /* chase camera */
  const sf = clamp(speed / VTURBO);
  camH += wrapA(p.h - camH) * (1 - Math.exp(-dt * 3.5));
  const cx = Math.cos(camH), cz = -Math.sin(camH), back = 8 + sf * 5;
  G.shake *= Math.exp(-dt * 6);
  camera.position.set(p.x - cx * back + (Math.random() - 0.5) * G.shake * 0.7, 3.3 + sf * 1.6 + (Math.random() - 0.5) * G.shake * 0.5, p.z - cz * back);
  camera.lookAt(p.x + cx * 5, 1.2, p.z + cz * 5);
  const fov = baseFov() + sf * 16;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * (1 - Math.exp(-dt * 4)); camera.updateProjectionMatrix(); }
}

/* menu backdrop: a slow orbit around the car */
function updateMenu() {
  const a = tClock * 0.15;
  camera.position.set(player.x + Math.sin(a) * 70, 38, player.z + Math.cos(a) * 70);
  camera.lookAt(player.x, 2, player.z);
}

/* ============ main loop ============ */
let tClock = 0, prev = performance.now(), groundT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; tClock += dt;
  pumpTiles(dt);
  if (G.mode === 'drive') updateDrive(dt);
  else { placeCar(player.car, player.x, player.z, player.h, 0, dt, false); updateMenu(); }
  ground.position.x = camera.position.x; ground.position.z = camera.position.z;
  groundTex.offset.set((camera.position.x / GPER) % 1, (-camera.position.z / GPER) % 1);
  groundT -= dt;
  if (groundT <= 0) { groundT = 0.5; const k = sstep(8, 12, toLat(player.z)); cTmp.copy(cGreen).lerp(cDry, k); groundMat.color.copy(cTmp); }
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
