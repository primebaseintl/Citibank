<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Harbor Valet</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #14110f; overscroll-behavior: none; touch-action: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #app canvas { cursor: grab; }
  #app canvas:active { cursor: grabbing; }
  button { font-family: inherit; }

  /* ---------- hotel tour UI (unchanged) ---------- */
  .zone { position: fixed; left: 20px; top: 18px; padding: 10px 16px; border-radius: 12px;
    background: rgba(20,17,15,.6); backdrop-filter: blur(6px); font-size: 22px; font-weight: 700; letter-spacing: -.02em; pointer-events: none; }
  #map { position: fixed; right: 16px; top: 16px; width: 170px; height: 112px; border-radius: 12px;
    background: rgba(20,17,15,.6); backdrop-filter: blur(6px); pointer-events: none; }
  .hint { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); text-align: center; font-size: 17px; font-weight: 500;
    text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none; transition: opacity .4s; padding: 0 16px; }
  #mode { position: fixed; left: 16px; bottom: calc(5vh + 44px); padding: 10px 14px; border: 0; border-radius: 12px;
    background: rgba(20,17,15,.65); backdrop-filter: blur(6px); color: #fff;
    font-size: 15px; font-weight: 700; z-index: 5; }
  #mode.on { background: #c9a24a; color: #14110f; }
  @media (hover: hover) and (pointer: fine) { #mode { display: none; } }
  #home { position: fixed; left: 20px; top: 84px; padding: 9px 14px; border: 0; border-radius: 12px; z-index: 5;
    background: rgba(20,17,15,.65); backdrop-filter: blur(6px); color: #fff; font-size: 15px; font-weight: 700; }
  body:not([data-mode="tour"]) .tour-ui { display: none !important; }
  #err { display: none; position: fixed; inset: 0; padding: 40px; font-size: 20px; background: #14110f; z-index: 50; }
  @media (max-width: 600px) { #map { width: 130px; height: 86px; } .zone { font-size: 18px; } }

  /* ---------- driving and walking HUD ---------- */
  #hud { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  body[data-mode="drive"] #hud, body[data-mode="foot"] #hud { display: block; }
  .pill { position: absolute; background: rgba(20,17,15,.62); backdrop-filter: blur(6px); border-radius: 12px; padding: 8px 14px;
    font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .pill small { font-size: 13px; font-weight: 500; opacity: .7; }
  #topL { left: 14px; top: calc(14px + env(safe-area-inset-top)); }
  #topR { right: 14px; top: calc(14px + env(safe-area-inset-top)); }
  #pips { display: flex; gap: 4px; }
  #pips i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); }
  #pips i.on { background: #f0cf7a; }
  #clock { position: absolute; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%);
    font-size: 40px; font-weight: 700; letter-spacing: -.03em; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  #clock.low { color: #ff9a7a; }
  #goal { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; white-space: nowrap;
    background: rgba(20,17,15,.55); backdrop-filter: blur(6px); font-size: 15px; font-weight: 500; }
  body[data-mode="foot"] #goal, body[data-free="1"] #goal { top: calc(14px + env(safe-area-inset-top)); }
  #arrow { flex: none; transition: transform .08s linear; }
  #util { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
  #util button { border: 0; border-radius: 10px; padding: 8px 12px; background: rgba(20,17,15,.55); color: #fff; font-size: 13px; font-weight: 700; }
  #toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%) translateY(6px); opacity: 0; transition: opacity .25s, transform .25s;
    padding: 10px 16px; border-radius: 12px; background: rgba(20,17,15,.72); backdrop-filter: blur(6px); font-size: 17px; font-weight: 700; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #count { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 120px; font-weight: 700; letter-spacing: -.04em;
    text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  #keyhelp { position: absolute; left: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); font-size: 13px; opacity: .75; text-shadow: 0 1px 6px rgba(0,0,0,.7); max-width: 38vw; }
  @media (hover: none) { #keyhelp { display: none; } }
  @media (max-width: 600px) { #pips { display: none; } #clock { font-size: 34px; } }

  #mic { display: none; }
  #util button.live { background: #c9a24a; color: #14110f; }
  .field { display: block; width: 100%; min-height: 50px; margin: 0 0 10px; padding: 0 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(20,17,15,.35); color: #fff; font: inherit; font-size: 18px; user-select: text; -webkit-user-select: text; }
  .field:focus-visible { outline: 3px solid #f0cf7a; outline-offset: 2px; }
  #room { display: none; left: 14px; top: calc(62px + env(safe-area-inset-top)); font-size: 14px; padding: 6px 12px; }
  /* walk mode and free-drive tweaks */
  body[data-mode="foot"] #topL, body[data-mode="foot"] #topR, body[data-mode="foot"] #clock, body[data-mode="foot"] #arrow, body[data-mode="foot"] #restartB,
  body[data-free="1"] #topL, body[data-free="1"] #clock, body[data-free="1"] #arrow, body[data-free="1"] #restartB { display: none; }
  body[data-free="1"] #topR { top: calc(62px + env(safe-area-inset-top)); }
  #act { position: absolute; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; pointer-events: auto;
    border: 0; border-radius: 14px; padding: 12px 24px; min-height: 48px; background: #c9a24a; color: #14110f; font-size: 18px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); white-space: nowrap; cursor: pointer; }
  #act.show { display: block; }
  #act:focus-visible { outline: 3px solid #f0cf7a; outline-offset: 2px; }
  @media (hover: none) { #act { bottom: calc(176px + env(safe-area-inset-bottom)); } }

  /* ---------- touch pedals ---------- */
  #pad { display: none; position: fixed; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom)); z-index: 6;
    justify-content: space-between; align-items: flex-end; padding: 0 14px; pointer-events: none; }
  @media (hover: none) { body[data-mode="drive"] #pad, body[data-mode="foot"] #pad { display: flex; } }
  .cluster { display: flex; gap: 10px; align-items: flex-end; }
  .pb { pointer-events: auto; touch-action: none; border: 0; border-radius: 22px; width: 78px; height: 78px; color: #fff; font-size: 16px; font-weight: 700;
    background: rgba(20,17,15,.55); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; }
  .pb.big { width: 92px; height: 110px; background: rgba(201,162,74,.78); color: #14110f; box-shadow: none; }
  .pb.sm { width: 64px; height: 50px; border-radius: 16px; font-size: 14px; }
  .pb.down { transform: scale(.94); background: rgba(240,207,122,.9); color: #14110f; }
  .stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }

  /* ---------- cards ---------- */
  #card { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 20px;
    background: rgba(20,17,15,.5); backdrop-filter: blur(3px); touch-action: auto; user-select: none; }
  #card.on { display: flex; }
  .panel { width: 100%; max-width: 440px; padding: 28px 24px 24px; border-radius: 20px; background: rgba(31,58,64,.94);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 0 0 2px rgba(201,162,74,.55); }
  .panel h1 { font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: -.035em; margin-bottom: 14px; color: #f6e3ae; }
  .panel p { font-size: 17px; line-height: 1.45; opacity: .9; margin-bottom: 14px; }
  .panel p.sub { font-size: 14px; opacity: .65; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 4px 0 18px; font-size: 17px; }
  .stats dt { opacity: .75; } .stats dd { font-weight: 700; text-align: right; }
  .stats .total { grid-column: 1 / -1; display: flex; justify-content: space-between; padding-top: 10px; margin-top: 4px; border-top: 1px solid rgba(255,255,255,.2); font-size: 22px; font-weight: 700; color: #f6e3ae; }
  .btn { display: block; width: 100%; min-height: 54px; margin-top: 10px; border-radius: 14px; border: 2px solid rgba(255,255,255,.35);
    background: transparent; color: #fff; font-size: 18px; font-weight: 700; padding: 0 16px; cursor: pointer; }
  .btn.primary { background: #c9a24a; border-color: #c9a24a; color: #14110f; }
  .btn:focus-visible, #util button:focus-visible, #home:focus-visible { outline: 3px solid #f0cf7a; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #toast, #arrow { transition: none; } }
</style>
</head>
<body data-mode="menu" data-free="0">
<div id="app"></div>

<!-- tour UI -->
<div class="zone tour-ui" id="zone"></div>
<canvas class="tour-ui" id="map" width="340" height="224"></canvas>
<div class="hint tour-ui" id="hint">Scroll, swipe, or use the arrow keys to walk in</div>
<button class="tour-ui" id="mode">Mode: Walk</button>
<button class="tour-ui" id="home">Back to the game</button>

<!-- driving and walking HUD -->
<div id="hud">
  <div class="pill" id="topL"><span id="pips"></span><b id="kc">0/8</b><small>keys</small></div>
  <div id="clock">1:00</div>
  <div class="pill" id="topR"><b id="spd">0</b><small>km/h</small></div>
  <div id="goal">
    <svg id="arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 L20 21 L12 16 L4 21 Z" fill="#f0cf7a"/></svg>
    <span id="goalTxt">Get ready</span>
  </div>
  <div class="pill" id="room"></div>
  <div id="toast"></div>
  <div id="count"></div>
  <div id="keyhelp">W A S D or arrow keys to drive, Space to drift, R to restart</div>
  <button id="act">Get in car</button>
  <div id="util"><button id="mic">Mic off</button><button id="snd">Sound on</button><button id="restartB">Restart</button><button id="menuB">Menu</button></div>
</div>

<!-- touch pedals -->
<div id="pad">
  <div class="cluster">
    <button class="pb" data-k="left" aria-label="Steer left"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M16 3 L6 12 L16 21 Z" fill="currentColor"/></svg></button>
    <button class="pb" data-k="right" aria-label="Steer right"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 3 L18 12 L8 21 Z" fill="currentColor"/></svg></button>
  </div>
  <div class="cluster">
    <div class="stack"><button class="pb sm" data-k="hand">Drift</button><button class="pb" data-k="brake">Brake</button></div>
    <button class="pb big" data-k="gas">Gas</button>
  </div>
</div>

<div id="card"><div class="panel" id="panel"></div></div>
<div id="err">The 3D library could not load. Check your internet connection and reload the page.</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'block'; return; }

/* Wait for the font so the signs are painted with it (falls back after 1.5s) */
let booted = false;
function boot() { if (booted) return; booted = true; start(); }
if (document.fonts && document.fonts.load) {
  Promise.race([
    document.fonts.load('700 48px "Bricolage Grotesque"'),
    new Promise(r => setTimeout(r, 1500))
  ]).then(boot, boot);
} else boot();

function start() {
const T = THREE;

/* ============ utilities ============ */
let seed = 11;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rnd = (a, b) => a + rand() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const P = (x, y, z) => new T.Vector3(x, y, z);
const $ = id => document.getElementById(id);

/* game state lives up here so every handler can see it */
const G = { mode: 'menu', phase: 'idle', keys: 0, total: 8, bumps: 0, time: 60, cd: 0, shake: 0, parkT: 0, win: false };

/* ============ renderer, scene, camera ============ */
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   /* shadows are drawn once, the scene is static (cars and people use blob shadows) */
renderer.shadowMap.needsUpdate = true;
$('app').appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.Fog(0xc9a08e, 110, 340);
const camera = new T.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 900);
const baseFov = () => camera.aspect < 1 ? 78 : 62;
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = baseFov();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fitCamera();
addEventListener('resize', fitCamera);

/* ============ texture helpers ============ */
function makeTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.encoding = T.sRGBEncoding;
  if (opts.clamp) { t.wrapS = t.wrapT = T.ClampToEdgeWrapping; t.generateMipmaps = false; t.minFilter = T.LinearFilter; }
  else { t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
  return t;
}
function tiled(base, rx, ry, extra = {}) {
  const t = base.clone(); t.needsUpdate = true; t.repeat.set(rx, ry);
  return new T.MeshStandardMaterial(Object.assign({ map: t, roughness: 0.85 }, extra));
}
const std = (color, rough = 0.85, metal = 0, extra = {}) =>
  new T.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: metal }, extra));
const glow = color => new T.MeshBasicMaterial({ color });

const woodTex = makeTex(512, 512, (g, w, h) => {
  for (let x = 0; x < w; x += 64) {
    g.fillStyle = `hsl(${rnd(24, 32)},${rnd(38, 50)}%,${rnd(30, 40)}%)`; g.fillRect(x, 0, 64, h);
    for (let k = 0; k < 50; k++) {
      g.strokeStyle = `rgba(40,20,5,${rnd(0.04, 0.14)})`; g.lineWidth = rnd(0.5, 1.6); g.beginPath();
      const gx = x + rnd(3, 61), gy = rnd(0, h); g.moveTo(gx, gy); g.lineTo(gx + rnd(-4, 4), gy + rnd(60, 260)); g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(x, 0, 2, h); g.fillRect(x, rnd(60, h - 60), 64, 2);
  }
});
const marbleTex = makeTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#4d4a47' : '#efe9dc'; g.fillRect(i * 256, j * 256, 256, 256); }
  for (let k = 0; k < 70; k++) {
    g.strokeStyle = `rgba(${k % 2 ? '255,255,255' : '60,55,50'},${rnd(0.05, 0.16)})`; g.lineWidth = rnd(0.6, 2); g.beginPath();
    let x = rnd(0, w), y = rnd(0, h); g.moveTo(x, y);
    for (let s = 0; s < 6; s++) { x += rnd(-40, 40); y += rnd(-40, 40); g.lineTo(x, y); }
    g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(255, 0, 2, h); g.fillRect(0, 255, w, 2); g.fillRect(0, 0, 2, h); g.fillRect(0, 0, w, 2);
});
const carpetTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#cfcac2'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(${rand() < .5 ? '0,0,0' : '255,255,255'},${rnd(0.03, 0.09)})`; g.fillRect(rnd(0, w), rnd(0, h), 1.5, 1.5); }
});
const tileTex = makeTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = `hsl(38,${rnd(22, 30)}%,${rnd(80, 86)}%)`; g.fillRect(i * 128, j * 128, 128, 128); }
  g.fillStyle = 'rgba(90,80,60,.45)';
  for (let i = 0; i <= 4; i++) { g.fillRect(i * 128 - 1, 0, 3, h); g.fillRect(0, i * 128 - 1, w, 3); }
});
const paveTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b4ab9d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = `hsl(35,8%,${rnd(62, 70)}%)`; g.fillRect(i * 128 + 2, j * 128 + 2, 124, 124); }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0.02, 0.07)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
});
const stoneTex = makeTex(512, 512, (g, w, h) => {
  g.fillStyle = '#6e6659'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) {
    let x = -rnd(0, 120);
    while (x < w) {
      const bw = rnd(110, 190);
      g.fillStyle = `hsl(38,${rnd(12, 20)}%,${rnd(66, 76)}%)`; g.fillRect(x + 2, r * 64 + 2, bw - 4, 60);
      x += bw;
    }
  }
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0.02, 0.08)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
});
const asphaltTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b3b40'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 7000; i++) { g.fillStyle = `rgba(${rand() < .5 ? '0,0,0' : '255,255,255'},${rnd(0.04, 0.12)})`; g.fillRect(rnd(0, w), rnd(0, h), 1.5, 1.5); }
});
const grassTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4a6a3c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `hsla(${rnd(80, 110)},${rnd(30, 45)}%,${rnd(22, 38)}%,.5)`; g.fillRect(rnd(0, w), rnd(0, h), 2, 3); }
});
const causticTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#bfe9f5'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 40; k++) {
    g.strokeStyle = `rgba(255,255,255,${rnd(0.15, 0.4)})`; g.lineWidth = rnd(1, 3); g.beginPath();
    let x = rnd(0, w), y = rnd(0, h); g.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += rnd(-30, 30); y += rnd(-30, 30); g.lineTo(x, y); }
    g.stroke();
  }
});
const runnerTex = makeTex(1024, 410, (g, w, h) => {
  g.fillStyle = '#6b2330'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9a24a'; g.lineWidth = 8; g.strokeRect(22, 22, w - 44, h - 44);
  g.lineWidth = 3; g.strokeRect(44, 44, w - 88, h - 88);
  g.fillStyle = 'rgba(201,162,74,.5)';
  for (let x = 90; x < w - 60; x += 110) { g.beginPath(); g.moveTo(x, h / 2 - 40); g.lineTo(x + 40, h / 2); g.lineTo(x, h / 2 + 40); g.lineTo(x - 40, h / 2); g.closePath(); g.fill(); }
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0.04, 0.1)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
}, { clamp: true });
const rugTex = makeTex(512, 384, (g, w, h) => {
  g.fillStyle = '#1f3a40'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9a24a'; g.lineWidth = 10; g.strokeRect(20, 20, w - 40, h - 40);
  g.lineWidth = 3; g.strokeRect(44, 44, w - 88, h - 88);
  g.fillStyle = 'rgba(201,162,74,.55)'; g.beginPath(); g.ellipse(w / 2, h / 2, 110, 70, 0, 0, 7); g.fill();
  g.fillStyle = '#1f3a40'; g.beginPath(); g.ellipse(w / 2, h / 2, 80, 46, 0, 0, 7); g.fill();
}, { clamp: true });

function artTex(s) {
  return makeTex(256, 340, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    const sets = [['#1f3a40', '#c9a24a'], ['#8a3b3b', '#f1e3c2'], ['#3f7f8a', '#e8c46a'], ['#2c2f4a', '#e58a5b']];

/* building facade with windows (colour map + glow map) */
function facade(wm, hm, cols, floors, litChance) {
  const ppm = 36, w = Math.round(wm * ppm), h = Math.round(hm * ppm);
  const c1 = document.createElement('canvas'), c2 = document.createElement('canvas');
  c1.width = c2.width = w; c1.height = c2.height = h;
  const a = c1.getContext('2d'), b = c2.getContext('2d');
  a.fillStyle = '#d6c9b2'; a.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { a.fillStyle = `rgba(0,0,0,${rnd(0.015, 0.05)})`; a.fillRect(rnd(0, w), rnd(0, h), 2, 3); }
  b.fillStyle = '#000'; b.fillRect(0, 0, w, h);
  const cw = w / cols, fh = h / floors;
  for (let c = 0; c <= cols; c++) { a.fillStyle = 'rgba(90,75,55,.28)'; a.fillRect(c * cw - 5, 0, 10, h); }
  for (let f = 0; f < floors; f++) {
    a.fillStyle = 'rgba(90,75,55,.35)'; a.fillRect(0, f * fh, w, 7);
    for (let c = 0; c < cols; c++) {
      const ww = cw * 0.5, wh = fh * 0.62, x0 = c * cw + (cw - ww) / 2, y0 = f * fh + fh * 0.17;
      const lit = rand() < litChance;
      a.fillStyle = '#f1eadb'; a.fillRect(x0 - 5, y0 - 5, ww + 10, wh + 10);
      const gr = a.createLinearGradient(0, y0, 0, y0 + wh);
      if (lit) { gr.addColorStop(0, '#ffe0a6'); gr.addColorStop(1, '#f0b061'); } else { gr.addColorStop(0, '#2b4152'); gr.addColorStop(1, '#6f8ea3'); }
      a.fillStyle = gr; a.fillRect(x0, y0, ww, wh);
      if (!lit) { a.fillStyle = 'rgba(255,255,255,.13)'; a.beginPath(); a.moveTo(x0, y0 + wh); a.lineTo(x0 + ww * 0.55, y0); a.lineTo(x0 + ww * 0.8, y0); a.lineTo(x0 + ww * 0.25, y0 + wh); a.fill(); }
      a.fillStyle = '#f1eadb'; a.fillRect(x0 + ww / 2 - 2, y0, 4, wh);
      a.fillStyle = 'rgba(60,50,40,.55)'; a.fillRect(x0 - 8, y0 + wh + 5, ww + 16, 6);
      if (lit) {
        b.fillStyle = `rgba(255,205,135,${rnd(0.55, 0.95)})`; b.fillRect(x0, y0, ww, wh);
        a.fillStyle = 'rgba(190,120,80,.35)'; a.fillRect(x0, y0, ww * 0.22, wh); a.fillRect(x0 + ww * 0.78, y0, ww * 0.22, wh);
      }
    }
  }
  const mk = c => { const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
  return { map: mk(c1), em: mk(c2) };
}

/* wall along an axis with openings. axis 'x': runs along x at z = fixed. openings: [from, to, openHeight] */
function wall(axis, fixed, a, b, openings, height, mat, opts = {}) {
  const thick = opts.thick || 0.3;
  const ops = openings.slice().sort((p, q) => p[0] - q[0]);
  const piece = (from, to, y0, y1, base) => {
    const len = to - from, hh = y1 - y0;
    if (len < 0.001 || hh < 0.001) return;
    const mid = (from + to) / 2, ym = (y0 + y1) / 2;
    if (axis === 'x') box(len, hh, thick, mat, mid, ym, fixed, null, true); else box(thick, hh, len, mat, fixed, ym, mid, null, true);
    if (base) { if (axis === 'x') box(len, 0.14, thick + 0.05, matTrim, mid, 0.07, fixed); else box(thick + 0.05, 0.14, len, matTrim, fixed, 0.07, mid); }
  };
  let cur = a;
  for (const [f, t, oh] of ops) {
    piece(cur, f, 0, height, true); piece(f, t, oh, height, false); cur = t;
    const jam = (p) => { if (axis === 'x') box(0.08, oh, thick + 0.06, matTrim, p, oh / 2, fixed); else box(thick + 0.06, oh, 0.08, matTrim, fixed, oh / 2, p); };
    jam(f); jam(t);
    if (axis === 'x') box(t - f, 0.1, thick + 0.06, matTrim, (f + t) / 2, oh, fixed); else box(thick + 0.06, 0.1, t - f, matTrim, fixed, oh, (f + t) / 2);
  }
  piece(cur, b, 0, height, true);
}

/* every pose is rebuilt each frame from these few rotations */
function setPose(h, st, t) {
  const L = h.legs[0], R = h.legs[1], aL = h.arms[0], aR = h.arms[1], o = h.off;
  h.body.rotation.set(0, 0, 0); h.body.position.set(0, 0, 0); h.head.rotation.set(0, 0, 0);
  h.legs.forEach(l => { l.hip.rotation.set(0, 0, 0); l.knee.rotation.set(0, 0, 0); });
  h.arms.forEach(a => { a.sh.rotation.set(0, 0, 0); a.el.rotation.set(0, 0, 0); });
  switch (st) {
    case 'walk': {
      const s = Math.sin(h.ph), c = Math.cos(h.ph), a = h.amp;
      L.hip.rotation.x = s * a; R.hip.rotation.x = -s * a;
      L.knee.rotation.x = Math.max(0, -c) * a * 1.2; R.knee.rotation.x = Math.max(0, c) * a * 1.2;
      aL.sh.rotation.x = -s * a * 0.8; aR.sh.rotation.x = s * a * 0.8;
      aL.el.rotation.x = aR.el.rotation.x = -(0.25 + a * 0.5);
      h.body.position.y = Math.abs(c) * 0.035 * (a > 0.6 ? 1.6 : 1);
      break;
    }
    case 'sit': case 'eat': {
      h.body.position.y = -0.32;
      L.hip.rotation.x = R.hip.rotation.x = -1.5708; L.knee.rotation.x = R.knee.rotation.x = 1.5708;
      aL.sh.rotation.x = -0.4; aL.el.rotation.x = -1.1;
      if (st === 'eat') {
        const p = 0.5 - 0.5 * Math.cos(t * 2.1 + o);
        aR.sh.rotation.x = -0.25 - p * 0.6; aR.el.rotation.x = -1.2 - p * 1.0; h.head.rotation.x = 0.08 + p * 0.06;
      } else { aR.sh.rotation.x = -0.4; aR.el.rotation.x = -1.1; }
      h.head.rotation.y = Math.sin(t * 0.4 + o) * 0.3;
      break;
    }
    case 'type':
      aL.sh.rotation.x = aR.sh.rotation.x = -0.5; aL.el.rotation.x = -1.1 + Math.sin(t * 13 + o) * 0.07; aR.el.rotation.x = -1.1 + Math.sin(t * 11 + o) * 0.07;
      h.head.rotation.x = 0.2; h.head.rotation.y = Math.sin(t * 0.7 + o) * 0.25; h.body.position.y = Math.sin(t * 1.7 + o) * 0.004;
      break;
    case 'polish':
      aL.sh.rotation.x = aR.sh.rotation.x = -0.55; aL.el.rotation.x = -1.25 + Math.sin(t * 5 + o) * 0.22; aR.el.rotation.x = -1.2 - Math.sin(t * 5 + o) * 0.22;
      h.head.rotation.x = 0.12; h.head.rotation.y = Math.sin(t * 0.6 + o) * 0.3;
      break;
    case 'clean':
      h.body.rotation.x = 0.35;
      aR.sh.rotation.x = -1.0 + Math.sin(t * 3.2 + o) * 0.25; aR.sh.rotation.z = Math.sin(t * 3.2 + o) * 0.45; aR.el.rotation.x = -0.3;
      aL.sh.rotation.x = -0.6; aL.el.rotation.x = -0.5; h.head.rotation.x = 0.1;
      break;
    case 'wave':
      aR.sh.rotation.z = 2.6; aR.el.rotation.z = Math.sin(t * 7 + o) * 0.6; aL.sh.rotation.z = -0.08;
      h.head.rotation.y = Math.sin(t * 0.8 + o) * 0.2; h.body.position.y = Math.sin(t * 1.7 + o) * 0.004;
      break;
    case 'swim':

}

const pick = a => a[Math.floor(rand() * a.length)];
function npc(o) {
  const look = Object.assign({ skin: pick(SK), hair: pick(HR), shirt: pick(SHIRT), pants: pick(PANTS), s: rnd(0.94, 1.06) }, o.look || {});
  const n = Object.assign({ x: 0, z: 0, y: 0, hd: 0, v: 0, i: 0, dir: 1, wait: 0, speed: rnd(1.1, 1.45), st0: 'idle', actSt: 'idle' }, o);

    n.hd = Math.atan2(n.route[n.i].x - n.x, n.route[n.i].z - n.z);

  npcs.push(n); return n;
}
const turnToA = (a, b, dt, k) => wrapA(a + wrapA(b - a) * (1 - Math.exp(-dt * k)));
function advance(n) { const L = n.route.length; n.i += n.dir; if (n.i >= L) { n.dir = -1; n.i = L - 2; } else if (n.i < 0) { n.dir = 1; n.i = 1; } }
function stepNPC(n, dt, t) {
  const h = n.h; let moving = false;
  if (n.route) {
    const P0 = n.route[n.i];
    if (n.wait > 0) {
      n.wait -= dt; if (P0.face !== undefined) n.hd = turnToA(n.hd, P0.face, dt, 4);
      if (n.wait <= 0) advance(n);
    } else {
      const dx = P0.x - n.x, dz = P0.z - n.z, d = Math.hypot(dx, dz);
      if (d < 0.15) { if (P0.wait) { n.wait = P0.wait; n.actSt = P0.act || 'idle'; } else advance(n); }

        const want = Math.atan2(dx, dz); n.hd = turnToA(n.hd, want, dt, 7);

        n.x += Math.sin(n.hd) * sp * dt; n.z += Math.cos(n.hd) * sp * dt; n.v = sp; moving = true;

  if (!moving) n.v = 0;
  let st;
  if (n.force) st = n.force;
  else if (n.route) st = n.v > 0.1 ? 'walk' : (n.wait > 0 ? n.actSt : 'idle');

}

/* --- doors slide open for anyone nearby --- */
function updateDoors(dt) {
  let near = false;
  const chk = (x, z) => { if (Math.abs(x) < 4.8 && z > -3.5 && z < 5) near = true; };
  npcs.forEach(n => { if (n.route) chk(n.x, n.z); });
  if (G.mode === 'foot') chk(me.x, me.z);
  if (G.mode === 'tour') chk(camera.position.x, camera.position.z);
  Object.values(remotes).forEach(r => { if (r.mode === 0) chk(r.ax, r.az); });
  doorT += ((near ? 1 : 0) - doorT) * (1 - Math.exp(-dt * 3));
  doorPanels.forEach(d => { d.g.position.x = d.sd * (1.2 + 2.4 * doorT); });
}

/* --- pushing a walker out of walls, furniture, cars --- */
function pushOut(o, r) {
  const circ = (cx, cz, cr) => {
    let dx = o.x - cx, dz = o.z - cz; const d = Math.hypot(dx, dz), m = r + cr;
    if (d >= m) return;
    if (d < 1e-4) { dx = 1; dz = 0; } else { dx /= d; dz /= d; }
    o.x = cx + dx * m; o.z = cz + dz * m;
  };
  const pc = Math.cos(player.h), ps = -Math.sin(player.h);
  for (let it = 0; it < 3; it++) {
    for (const rc of walkR) {
      const qx = clamp(o.x, rc.x1, rc.x2), qz = clamp(o.z, rc.z1, rc.z2);
      const dx = o.x - qx, dz = o.z - qz, d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-8) { const d = Math.sqrt(d2); o.x += dx / d * (r - d); o.z += dz / d * (r - d); }
      else {
        const l = o.x - rc.x1, rr = rc.x2 - o.x, tt = o.z - rc.z1, bb = rc.z2 - o.z, mn = Math.min(l, rr, tt, bb);
        if (mn === l) o.x = rc.x1 - r; else if (mn === rr) o.x = rc.x2 + r; else if (mn === tt) o.z = rc.z1 - r; else o.z = rc.z2 + r;
      }
    }
    walkC.forEach(c => circ(c.x, c.z, c.r));
    obst.forEach(c => circ(c.x, c.z, c.r));
    traffic.forEach(t => { circ(t.x + t.dir * 1.25, t.z, 1.0); circ(t.x - t.dir * 1.25, t.z, 1.0); });
    circ(player.x + pc * 1.25, player.z + ps * 1.25, 1.0); circ(player.x - pc * 1.25, player.z - ps * 1.25, 1.0);
    Object.values(remotes).forEach(r => {
      if (r.mode === 0) circ(r.ax, r.az, 0.35);
      circ(r.acx + Math.cos(r.ach) * 1.25, r.acz - Math.sin(r.ach) * 1.25, 1.0); circ(r.acx - Math.cos(r.ach) * 1.25, r.acz + Math.sin(r.ach) * 1.25, 1.0);
    });
  }
  o.x = clamp(o.x, -X_LIM, X_LIM); o.z = Math.min(o.z, Z_LIM);
}
function inWall(x, z, pad) { return walkR.some(rc => x > rc.x1 - pad && x < rc.x2 + pad && z > rc.z1 - pad && z < rc.z2 + pad); }
function carDist() {
  const c = Math.cos(player.h), s = -Math.sin(player.h);
  return Math.min(Math.hypot(me.x - (player.x + c * 1.25), me.z - (player.z + s * 1.25)), Math.hypot(me.x - (player.x - c * 1.25), me.z - (player.z - s * 1.25)));
}

/* --- sound (engine hum plus a few blips, started from the Start button) --- */
let audio = null, muted = false;
function initAudio() {
  if (audio) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 50;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const gain = ctx.createGain(); gain.gain.value = 0;
    osc.connect(lp); lp.connect(gain); gain.connect(ctx.destination); osc.start();
    audio = { ctx, osc, gain };
  } catch (e) { audio = null; }
}
function blip(f, d, type, vol, f2) {
  if (!audio || muted) return;
  const c = audio.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
}
const chime = () => { blip(880, 0.18, 'sine', 0.12); setTimeout(() => blip(1320, 0.28, 'sine', 0.1), 90); };

function resetRun() {
  Object.assign(player, { x: START.x, z: START.z, h: START.h, vx: 0, vz: 0, fv: 0, steer: 0, bumpCd: 0 });
  camH = START.h;
  keyObjs.forEach(k => { k.got = false; k.g.visible = true; });
  Object.assign(G, { keys: 0, bumps: 0, time: 60, parkT: 0, shake: 0, win: false });
  [].forEach.call(pipsEl.children, p => p.classList.remove('on'));
  $('kc').textContent = '0/' + G.total;
}

/* --- on foot: start walking, get in the car, get out of the car --- */
function startWalk() {
  initAudio(); if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
  hideCard();

}
function enterCar() {

  G.phase = 'free'; document.body.dataset.free = '1';
  player.vx = player.vz = 0; player.fv = 0; camH = player.h;

}

  const p = player; p.vx = p.vz = 0; p.fv = 0;
  const c = Math.cos(p.h), s = -Math.sin(p.h), nx = -s, nz = c;
  const free = (x, z) => { const q = { x, z }; pushOut(q, 0.35); return Math.hypot(q.x - x, q.z - z) < 0.05; };
  let sd = 1;

  else if (G.mode === 'drive' && G.phase === 'free' && Math.hypot(player.vx, player.vz) < 3) exitCar();

function endRun(win) {
  G.phase = 'over'; G.win = win;
  const left = Math.max(0, G.time);
  const score = Math.max(0, G.keys * 250 + (win ? Math.round(left) * 60 + 500 : 0) - G.bumps * 75);
  let best = 0; try { best = +localStorage.getItem('harborValetBest') || 0; } catch (e) {}
  const isBest = score > best && score > 0;
  if (isBest) { try { localStorage.setItem('harborValetBest', String(score)); } catch (e) {} best = score; }
  if (win) fanfare(); else blip(220, 0.5, 'sawtooth', 0.12, 80);
  const html = '<h1>' + (win ? 'Checked in' : 'Out of time') + '</h1>' +
    '<p>' + (win ? 'The car is parked and the keys are at the desk.' : 'The bay is still waiting. Collect every key, then park before the clock hits zero.') + '</p>' +
    '<dl class="stats"><dt>Keys</dt><dd>' + G.keys + ' of ' + G.total + '</dd><dt>Time left</dt><dd>' + fmtT(left) + '</dd><dt>Bumps</dt><dd>' + G.bumps + '</dd>' +
    '<div class="total"><span>' + (isBest ? 'New best' : 'Score') + '</span><span>' + score.toLocaleString() + '</span></div>' +
    (isBest ? '' : '<dt>Best</dt><dd>' + best.toLocaleString() + '</dd>') + '</dl>';

/* --- collisions --- */
function bump(impact) {
  if (impact < 3.5) return;
  G.shake = Math.min(1, impact / 12);
  if (G.phase !== 'play' || player.bumpCd > 0) return;
  player.bumpCd = 0.9; G.bumps++; G.time -= 2;
  toast('Bump, minus 2 seconds'); blip(120, 0.25, 'square', 0.12, 40);
}
/* push the player's two body circles out of one obstacle circle (ox, oz, orad) moving at (ovx, ovz) */
function resolve(ox, oz, orad, ovx, ovz) {
  const c = Math.cos(player.h), s = -Math.sin(player.h);
  [1.25, -1.25].forEach(off => {
    const cx = player.x + c * off, cz = player.z + s * off;
    let dx = cx - ox, dz = cz - oz, d = Math.hypot(dx, dz); const min = 1.0 + orad;
    if (d >= min) return;
    if (d < 1e-4) { dx = 1; dz = 0; d = 1; }
    const nx = dx / d, nz = dz / d, pen = min - d;
    player.x += nx * pen; player.z += nz * pen;
    const vn = (player.vx - ovx) * nx + (player.vz - ovz) * nz;
    if (vn < 0) { player.vx -= 1.3 * vn * nx; player.vz -= 1.3 * vn * nz; bump(-vn); }
  });
}
function collideAll() {
  obst.forEach(o => resolve(o.x, o.z, o.r, 0, 0));
  traffic.forEach(t => [1.25, -1.25].forEach(off => resolve(t.x + t.dir * off, t.z, 1.0, t.dir * t.v, 0)));
  Object.values(remotes).forEach(r => [1.25, -1.25].forEach(off => resolve(r.acx + Math.cos(r.ach) * off, r.acz - Math.sin(r.ach) * off, 1.0, 0, 0)));
  /* hotel front and world edges */
  const c = Math.cos(player.h), s = -Math.sin(player.h);
  [1.25, -1.25].forEach(off => {
    const cz = player.z + s * off;
    if (cz - 1.0 < WALL_Z) { player.z += WALL_Z + 1.0 - cz; if (player.vz < 0) { bump(-player.vz); player.vz *= -0.25; } }
  });
  if (player.x > X_LIM) { player.x = X_LIM; player.vx = Math.min(0, player.vx); }
  if (player.x < -X_LIM) { player.x = -X_LIM; player.vx = Math.max(0, player.vx); }
  if (player.z > Z_LIM) { player.z = Z_LIM; player.vz = Math.min(0, player.vz); }
}

/* --- traffic (it brakes for whoever is in the road: you in the car, or you on foot) --- */
function stepTraffic(dt) {
  const sub = G.mode === 'drive' ? player : G.mode === 'foot' ? me : null;
  traffic.forEach(t => {
    let target = t.cruise;
    if (sub) { const rel = (sub.x - t.x) * t.dir; if (rel > -2 && rel < 10 && Math.abs(sub.z - t.z) < 2.8) target = 0; }
    traffic.forEach(o => { if (o !== t && o.dir === t.dir) { const r = (o.x - t.x) * t.dir; if (r > 0 && r < 11) target = Math.min(target, Math.max(0, o.v - 1.5)); } });
    t.v += clamp(target - t.v, -16 * dt, 4 * dt);
    t.x += t.dir * t.v * dt;
    if (t.x > 118) t.x = -118; else if (t.x < -118) t.x = 118;
    t.braking = target < t.v - 0.1;
    placeCar(t.car, t.x, t.z, t.dir > 0 ? 0 : Math.PI, t.v, dt, t.braking);
  });
}

  car.g.position.set(x, 0, z); car.g.rotation.y = h;
  const spin = fv * dt / 0.36; car.wheels.forEach(w => { w.rotation.z -= spin; });
  car.tail.material.color.setHex(braking ? 0xff3b30 : 0xc0242a);
}

/* --- driving step --- */
function updateDrive(dt) {
  const p = player; let inp = { l: 0, r: 0, gas: 0, brake: 0, hand: 0 };

  if (G.phase === 'count') {
    G.cd -= dt;
    $('count').textContent = G.cd > 2.4 ? '3' : G.cd > 1.4 ? '2' : G.cd > 0.4 ? '1' : 'Go';
    if (G.cd <= 0.4) G.phase = 'play';
  } else if (G.phase === 'play' || G.phase === 'free') {

    else $('count').textContent = '';

    if (G.phase === 'play') { G.time -= dt; if (G.time <= 0) { G.time = 0; endRun(false); } }
  } else { $('count').textContent = ''; }

  p.bumpCd = Math.max(0, p.bumpCd - dt);

      toast(G.keys === G.total ? 'All keys found. Park at the valet bay' : 'Key collected, plus 4 seconds');
    }
  });

  /* parking */
  const allKeys = G.keys === G.total;
  let aligned = false;
  if (G.phase === 'play' && allKeys) {
    const okPos = Math.abs(p.x - BAY.x) < 1.15 && Math.abs(p.z - BAY.z) < 1.7;
    const hd = Math.min(Math.abs(wrapA(p.h - Math.PI / 2)), Math.abs(wrapA(p.h + Math.PI / 2)));
    aligned = okPos && hd < 0.38;
    if (aligned && Math.hypot(p.vx, p.vz) < 1.3) G.parkT += dt; else G.parkT = Math.max(0, G.parkT - dt);
    if (G.parkT > 0.7) endRun(true);
  } else G.parkT = 0;
  bayBeam.visible = allKeys && G.phase === 'play';
  bayMat.opacity = allKeys ? 0.7 + 0.25 * Math.sin(tClock * 4) : 0.4;

  /* HUD */
  const speed = Math.hypot(p.vx, p.vz);
  $('spd').textContent = Math.round(speed * 3.6);
  const clock = $('clock'); clock.textContent = fmtT(G.time); clock.classList.toggle('low', G.time < 10 && G.phase === 'play');
  let tx = BAY.x, tz = BAY.z, label;
  if (!allKeys) {
    let best = 1e9; keyObjs.forEach(k => { if (k.got) return; const d = Math.hypot(k.x - p.x, k.z - p.z); if (d < best) { best = d; tx = k.x; tz = k.z; } });
    label = G.phase === 'count' ? 'Get ready' : 'Nearest key, ' + Math.round(best) + ' m';
  } else label = aligned ? 'Hold still' : 'Park nose-in at the valet bay, ' + Math.round(Math.hypot(tx - p.x, tz - p.z)) + ' m';
  if (G.phase === 'free') label = speed < 3 ? 'Free drive. Press E to get out' : 'Free drive. Slow down to get out';
  if (G.phase === 'over') label = G.win ? 'Checked in' : 'Out of time';
  $('goalTxt').textContent = label;
  $('arrow').style.transform = 'rotate(' + (-wrapA(Math.atan2(-(tz - p.z), tx - p.x) - p.h) * 180 / Math.PI) + 'deg)';
  const showAct = G.phase === 'free' && speed < 3;

  /* car, lights, sound */

  if (audio) {
    const now = audio.ctx.currentTime;

    audio.gain.gain.setTargetAtTime(muted || G.phase === 'over' ? 0 : 0.045 + (inp.gas ? 0.025 : 0), now, 0.08);
  }

  /* chase camera */

/* --- on-foot step: walk, run, turn, third-person camera that never sits inside a wall --- */
function updateFoot(dt) {
  const turn = ((kb.left || pad.left) ? 1 : 0) - ((kb.right || pad.right) ? 1 : 0);
  const fw = ((kb.gas || pad.gas) ? 1 : 0) - ((kb.brake || pad.brake) ? 1 : 0);
  const run = kb.run || kb.hand || pad.hand;
  me.ph = wrapA(me.ph + turn * 2.7 * dt);
  const tv = fw > 0 ? (run ? 5.4 : 2.7) : fw < 0 ? -1.6 : 0;
  me.v += (tv - me.v) * (1 - Math.exp(-dt * 9));
  me.x += Math.sin(me.ph) * me.v * dt; me.z += Math.cos(me.ph) * me.v * dt;
  pushOut(me, 0.35);

  const h = me.h;
  h.ph += me.v * dt * 4.5; h.amp = clamp(Math.abs(me.v) * 0.17, 0.1, 0.95);
  setPose(h, Math.abs(me.v) > 0.2 ? 'walk' : 'idle', tClock);
  h.root.position.set(me.x, 0, me.z); h.root.rotation.y = me.ph;
  me.mark.position.y = 2.15 + Math.sin(tClock * 3) * 0.06; me.mark.rotation.y = tClock * 2;

  /* camera */
  camP += wrapA(me.ph - camP) * (1 - Math.exp(-dt * 5));
  const fx = Math.sin(camP), fz = Math.cos(camP);
  let want = 4.6;
  for (let t = 0.6; t <= 4.6; t += 0.3) { if (inWall(me.x - fx * t, me.z - fz * t, 0.28)) { want = Math.max(1.1, t - 0.3); break; } }
  camD += (want - camD) * (1 - Math.exp(-dt * (want < camD ? 14 : 3)));
  camera.position.set(me.x - fx * camD, 1.35 + camD * 0.24, me.z - fz * camD);
  camera.lookAt(me.x + fx * 2, 1.25, me.z + fz * 2);
  const fov = baseFov();
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * (1 - Math.exp(-dt * 4)); camera.updateProjectionMatrix(); }

  /* HUD */
  const nearCar = carDist() < 2.7;
  $('goalTxt').textContent = nearCar ? 'Next to your car' : zoneAt(me.x, me.z);
  actEl.classList.toggle('show', nearCar); if (nearCar) actEl.textContent = 'Get in the car (E)';
}

/* --- tour step (unchanged behaviour) --- */
function updateTour(dt) {
  cur.sC += (cur.sT - cur.sC) * (1 - Math.exp(-dt * 4.5));
  const pose = evalSeg(cur.seg, cur.sC);
  camera.position.copy(pose.pos);
  if (first) { lookNow.copy(pose.look); first = false; } else lookNow.lerp(pose.look, 1 - Math.exp(-dt * 5));

  /* smooth head turn, then aim the camera */
  let da = yawT - yawC; da = Math.atan2(Math.sin(da), Math.cos(da));
  yawC += da * (1 - Math.exp(-dt * 8));
  pitchC += (pitchT - pitchC) * (1 - Math.exp(-dt * 8));
  const dir = lookNow.clone().sub(pose.pos).normalize();
  dir.applyAxisAngle(UP, yawC);
  dir.applyAxisAngle(new T.Vector3().crossVectors(dir, UP).normalize(), pitchC);
  camera.lookAt(pose.pos.clone().add(dir));
  updateHud();
  if ((fc++ & 3) === 0) drawMap();

/* --- menu backdrop: a slow orbit past the hotel while traffic rolls by --- */
function updateMenu() {
  const a = tClock * 0.12;
  camera.position.set(Math.sin(a) * 38, 7 + Math.sin(a * 0.7) * 2, 42 + Math.cos(a) * 5);
  camera.lookAt(0, 3, 8);
}

/* ============ main loop ============ */
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; tClock += dt;
  stepTraffic(dt);
  stepNPCs(dt);
  updateRemotes(dt);
  netTick(dt);
  voiceTick(dt);
  updateDoors(dt);
  if (G.mode === 'drive') updateDrive(dt);
  else {
    placeCar(player.car, player.x, player.z, player.h, 0, dt, false);
    keyObjs.forEach((k, i) => { if (!k.got) { k.k.rotation.y += dt * 2.2; k.k.position.y = 1.5 + Math.sin(tClock * 3 + i) * 0.15; } });
    bayMat.opacity = 0.4; bayBeam.visible = false;
    if (G.mode === 'tour') updateTour(dt); else if (G.mode === 'foot') updateFoot(dt); else updateMenu();
  }
  head.position.set(player.x + Math.cos(player.h) * 2, 0.9, player.z - Math.sin(player.h) * 2);
  head.target.position.set(player.x + Math.cos(player.h) * 14, 0.3, player.z - Math.sin(player.h) * 14);
  sky.position.copy(camera.position);
  water.map.offset.set(tClock * 0.015, tClock * 0.01);
  updateLights();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
/* =====================================================================

function netStart(host, code, name, done, fail) {

/* ---------- proximity voice chat ----------

const voice = { ctx: null, dest: null, micGain: null, micSrc: null, micStream: null, peers: {}, micOn: false, t: 0 };

async function toggleMic() {

$('mic').addEventListener('click', toggleMic);

function readName() {

  try { localStorage.setItem('harborValetName', nm); } catch (e) {}

}
function showNetCard(msg) {

    '<input class="field" id="nm" maxlength="14" placeholder="Your name" value="' + saved + '">' +
    '<input class="field" id="cd" maxlength="5" placeholder="Room code to join" autocapitalize="characters" autocomplete="off">' +
    '<p class="sub" id="netmsg">' + (typeof msg === 'string' ? msg : '') + '</p>',

function doHost() {
