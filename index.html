<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Harbor Hotel walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #14110f; overscroll-behavior: none; touch-action: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  /* Mouse movement does nothing. Only scrolling (wheel, swipe, arrow keys) moves you. */
  .zone { position: fixed; left: 20px; top: 18px; padding: 10px 16px; border-radius: 12px;
    background: rgba(20,17,15,.6); backdrop-filter: blur(6px); font-size: 22px; font-weight: 700; letter-spacing: -.02em; pointer-events: none; }
  .zone small { display: block; font-size: 13px; font-weight: 500; opacity: .7; letter-spacing: 0; }
  #map { position: fixed; right: 16px; top: 16px; width: 170px; height: 112px; border-radius: 12px;
    background: rgba(20,17,15,.6); backdrop-filter: blur(6px); pointer-events: none; }
  .hint { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); text-align: center; font-size: 17px; font-weight: 500;
    text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none; transition: opacity .4s; padding: 0 16px; }
  #err { display: none; position: fixed; inset: 0; padding: 40px; font-size: 20px; background: #14110f; z-index: 20; }
  @media (max-width: 600px) { #map { width: 130px; height: 86px; } .zone { font-size: 18px; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="zone" id="zone"></div>
<canvas id="map" width="340" height="224"></canvas>
<div class="hint" id="hint">Scroll, swipe, or use the arrow keys to walk in</div>
<div id="err">The 3D library could not load. Check your internet connection and reload the page.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'block'; return; }

/* Wait for the font so the signs are painted with it (falls back after 1.5s) */
let booted = false;
function boot() { if (booted) return; booted = true; start(); }
if (document.fonts && document.fonts.load) {
  Promise.race([
    document.fonts.load('700 48px "Bricolage Grotesque"'),
    new Promise(r => setTimeout(r, 1500))
  ]).then(boot, boot);
} else boot();

function start() {
const T = THREE;

/* ============ utilities ============ */
let seed = 11;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rnd = (a, b) => a + rand() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const P = (x, y, z) => new T.Vector3(x, y, z);

/* ============ renderer, scene, camera ============ */
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   /* shadows are drawn once, the scene is static */
renderer.shadowMap.needsUpdate = true;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.Fog(0xc9a08e, 110, 340);
const camera = new T.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 900);
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 78 : 62;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fitCamera();
addEventListener('resize', fitCamera);

/* ============ texture helpers ============ */
function makeTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.encoding = T.sRGBEncoding;
  if (opts.clamp) { t.wrapS = t.wrapT = T.ClampToEdgeWrapping; t.generateMipmaps = false; t.minFilter = T.LinearFilter; }
  else { t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
  return t;
}
function tiled(base, rx, ry, extra = {}) {
  const t = base.clone(); t.needsUpdate = true; t.repeat.set(rx, ry);
  return new T.MeshStandardMaterial(Object.assign({ map: t, roughness: 0.85 }, extra));
}
const std = (color, rough = 0.85, metal = 0, extra = {}) =>
  new T.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: metal }, extra));
const glow = color => new T.MeshBasicMaterial({ color });

const woodTex = makeTex(512, 512, (g, w, h) => {
  for (let x = 0; x < w; x += 64) {
    g.fillStyle = `hsl(${rnd(24, 32)},${rnd(38, 50)}%,${rnd(30, 40)}%)`; g.fillRect(x, 0, 64, h);
    for (let k = 0; k < 50; k++) {
      g.strokeStyle = `rgba(40,20,5,${rnd(0.04, 0.14)})`; g.lineWidth = rnd(0.5, 1.6); g.beginPath();
      const gx = x + rnd(3, 61), gy = rnd(0, h); g.moveTo(gx, gy); g.lineTo(gx + rnd(-4, 4), gy + rnd(60, 260)); g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(x, 0, 2, h); g.fillRect(x, rnd(60, h - 60), 64, 2);
  }
});
const marbleTex = makeTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#4d4a47' : '#efe9dc'; g.fillRect(i * 256, j * 256, 256, 256); }
  for (let k = 0; k < 70; k++) {
    g.strokeStyle = `rgba(${k % 2 ? '255,255,255' : '60,55,50'},${rnd(0.05, 0.16)})`; g.lineWidth = rnd(0.6, 2); g.beginPath();
    let x = rnd(0, w), y = rnd(0, h); g.moveTo(x, y);
    for (let s = 0; s < 6; s++) { x += rnd(-40, 40); y += rnd(-40, 40); g.lineTo(x, y); }
    g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(255, 0, 2, h); g.fillRect(0, 255, w, 2); g.fillRect(0, 0, 2, h); g.fillRect(0, 0, w, 2);
});
const carpetTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#cfcac2'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(${rand() < .5 ? '0,0,0' : '255,255,255'},${rnd(0.03, 0.09)})`; g.fillRect(rnd(0, w), rnd(0, h), 1.5, 1.5); }
});
const tileTex = makeTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = `hsl(38,${rnd(22, 30)}%,${rnd(80, 86)}%)`; g.fillRect(i * 128, j * 128, 128, 128); }
  g.fillStyle = 'rgba(90,80,60,.45)';
  for (let i = 0; i <= 4; i++) { g.fillRect(i * 128 - 1, 0, 3, h); g.fillRect(0, i * 128 - 1, w, 3); }
});
const paveTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b4ab9d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = `hsl(35,8%,${rnd(62, 70)}%)`; g.fillRect(i * 128 + 2, j * 128 + 2, 124, 124); }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0.02, 0.07)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
});
const stoneTex = makeTex(512, 512, (g, w, h) => {
  g.fillStyle = '#6e6659'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) {
    let x = -rnd(0, 120);
    while (x < w) {
      const bw = rnd(110, 190);
      g.fillStyle = `hsl(38,${rnd(12, 20)}%,${rnd(66, 76)}%)`; g.fillRect(x + 2, r * 64 + 2, bw - 4, 60);
      x += bw;
    }
  }
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0.02, 0.08)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
});
const asphaltTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b3b40'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 7000; i++) { g.fillStyle = `rgba(${rand() < .5 ? '0,0,0' : '255,255,255'},${rnd(0.04, 0.12)})`; g.fillRect(rnd(0, w), rnd(0, h), 1.5, 1.5); }
});
const grassTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4a6a3c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `hsla(${rnd(80, 110)},${rnd(30, 45)}%,${rnd(22, 38)}%,.5)`; g.fillRect(rnd(0, w), rnd(0, h), 2, 3); }
});
const causticTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#bfe9f5'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 40; k++) {
    g.strokeStyle = `rgba(255,255,255,${rnd(0.15, 0.4)})`; g.lineWidth = rnd(1, 3); g.beginPath();
    let x = rnd(0, w), y = rnd(0, h); g.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += rnd(-30, 30); y += rnd(-30, 30); g.lineTo(x, y); }
    g.stroke();
  }
});
const runnerTex = makeTex(1024, 410, (g, w, h) => {
  g.fillStyle = '#6b2330'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9a24a'; g.lineWidth = 8; g.strokeRect(22, 22, w - 44, h - 44);
  g.lineWidth = 3; g.strokeRect(44, 44, w - 88, h - 88);
  g.fillStyle = 'rgba(201,162,74,.5)';
  for (let x = 90; x < w - 60; x += 110) { g.beginPath(); g.moveTo(x, h / 2 - 40); g.lineTo(x + 40, h / 2); g.lineTo(x, h / 2 + 40); g.lineTo(x - 40, h / 2); g.closePath(); g.fill(); }
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0.04, 0.1)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
}, { clamp: true });
const rugTex = makeTex(512, 384, (g, w, h) => {
  g.fillStyle = '#1f3a40'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9a24a'; g.lineWidth = 10; g.strokeRect(20, 20, w - 40, h - 40);
  g.lineWidth = 3; g.strokeRect(44, 44, w - 88, h - 88);
  g.fillStyle = 'rgba(201,162,74,.55)'; g.beginPath(); g.ellipse(w / 2, h / 2, 110, 70, 0, 0, 7); g.fill();
  g.fillStyle = '#1f3a40'; g.beginPath(); g.ellipse(w / 2, h / 2, 80, 46, 0, 0, 7); g.fill();
}, { clamp: true });

function artTex(s) {
  return makeTex(256, 340, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    const sets = [['#1f3a40', '#c9a24a'], ['#8a3b3b', '#f1e3c2'], ['#3f7f8a', '#e8c46a'], ['#2c2f4a', '#e58a5b']];
    gr.addColorStop(0, sets[s % 4][0]); gr.addColorStop(1, sets[s % 4][1]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) {
      g.fillStyle = `rgba(${Math.floor(rnd(150, 255))},${Math.floor(rnd(120, 230))},${Math.floor(rnd(80, 200))},${rnd(0.25, 0.6)})`;
      g.beginPath();
      if (i % 2) g.arc(rnd(30, w - 30), rnd(30, h - 30), rnd(20, 70), 0, 7); else g.rect(rnd(0, w - 60), rnd(0, h - 60), rnd(40, 120), rnd(40, 140));
      g.fill();
    }
  }, { clamp: true });
}
const arts = [0, 1, 2, 3].map(artTex);

const skylineTex = makeTex(1024, 400, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#3b4a86'); gr.addColorStop(0.55, '#e58a5b'); gr.addColorStop(1, '#fbd89a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += rnd(30, 70)) {
    const bw = rnd(30, 70), bh = rnd(90, 260);
    g.fillStyle = '#1d2236'; g.fillRect(x, h - bh, bw, bh);
    for (let wy = h - bh + 10; wy < h - 10; wy += 14) for (let wx = x + 6; wx < x + bw - 8; wx += 12) {
      if (rand() < 0.35) { g.fillStyle = '#ffd27a'; g.fillRect(wx, wy, 5, 7); }
    }
  }
}, { clamp: true });

function labelTex(text, w, h, font, fg, bg) {
  return makeTex(w, h, (g) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 4);
  }, { clamp: true });
}

/* building facade with windows (colour map + glow map) */
function facade(wm, hm, cols, floors, litChance) {
  const ppm = 36, w = Math.round(wm * ppm), h = Math.round(hm * ppm);
  const c1 = document.createElement('canvas'), c2 = document.createElement('canvas');
  c1.width = c2.width = w; c1.height = c2.height = h;
  const a = c1.getContext('2d'), b = c2.getContext('2d');
  a.fillStyle = '#d6c9b2'; a.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { a.fillStyle = `rgba(0,0,0,${rnd(0.015, 0.05)})`; a.fillRect(rnd(0, w), rnd(0, h), 2, 3); }
  b.fillStyle = '#000'; b.fillRect(0, 0, w, h);
  const cw = w / cols, fh = h / floors;
  for (let c = 0; c <= cols; c++) { a.fillStyle = 'rgba(90,75,55,.28)'; a.fillRect(c * cw - 5, 0, 10, h); }
  for (let f = 0; f < floors; f++) {
    a.fillStyle = 'rgba(90,75,55,.35)'; a.fillRect(0, f * fh, w, 7);
    for (let c = 0; c < cols; c++) {
      const ww = cw * 0.5, wh = fh * 0.62, x0 = c * cw + (cw - ww) / 2, y0 = f * fh + fh * 0.17;
      const lit = rand() < litChance;
      a.fillStyle = '#f1eadb'; a.fillRect(x0 - 5, y0 - 5, ww + 10, wh + 10);
      const gr = a.createLinearGradient(0, y0, 0, y0 + wh);
      if (lit) { gr.addColorStop(0, '#ffe0a6'); gr.addColorStop(1, '#f0b061'); } else { gr.addColorStop(0, '#2b4152'); gr.addColorStop(1, '#6f8ea3'); }
      a.fillStyle = gr; a.fillRect(x0, y0, ww, wh);
      if (!lit) { a.fillStyle = 'rgba(255,255,255,.13)'; a.beginPath(); a.moveTo(x0, y0 + wh); a.lineTo(x0 + ww * 0.55, y0); a.lineTo(x0 + ww * 0.8, y0); a.lineTo(x0 + ww * 0.25, y0 + wh); a.fill(); }
      a.fillStyle = '#f1eadb'; a.fillRect(x0 + ww / 2 - 2, y0, 4, wh);
      a.fillStyle = 'rgba(60,50,40,.55)'; a.fillRect(x0 - 8, y0 + wh + 5, ww + 16, 6);
      if (lit) {
        b.fillStyle = `rgba(255,205,135,${rnd(0.55, 0.95)})`; b.fillRect(x0, y0, ww, wh);
        a.fillStyle = 'rgba(190,120,80,.35)'; a.fillRect(x0, y0, ww * 0.22, wh); a.fillRect(x0 + ww * 0.78, y0, ww * 0.22, wh);
      }
    }
  }
  const mk = c => { const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
  return { map: mk(c1), em: mk(c2) };
}
const facadeMat = (wm, hm, cols, floors, lit) => {
  const f = facade(wm, hm, cols, floors, lit);
  return new T.MeshStandardMaterial({ map: f.map, emissiveMap: f.em, emissive: 0xffffff, emissiveIntensity: 1, roughness: 0.85 });
};

/* ============ mesh helpers ============ */
function box(w, h, d, mat, x, y, z, parent, cast) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = !!cast; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent, seg, cast) {
  const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 20), mat);
  m.position.set(x, y, z); m.castShadow = !!cast; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function sph(r, mat, x, y, z, parent, flat) {
  const m = new T.Mesh(flat ? new T.IcosahedronGeometry(r, 1) : new T.SphereGeometry(r, 16, 12), mat);
  m.position.set(x, y, z); m.castShadow = false; (parent || scene).add(m); return m;
}
function plane(w, h, mat, x, y, z, rx, ry, parent) {
  const m = new T.Mesh(new T.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function floorPlane(x1, z1, x2, z2, mat, y) { return plane(x2 - x1, z2 - z1, mat, (x1 + x2) / 2, y || 0, (z1 + z2) / 2, -Math.PI / 2, 0); }
function ceilPlane(x1, z1, x2, z2, y) {
  const m = plane(x2 - x1, z2 - z1, matCeil, (x1 + x2) / 2, y, (z1 + z2) / 2, Math.PI / 2, 0); m.castShadow = true; return m;
}
function tex1(base, w, h, size, extra) { return tiled(base, w / size, h / size, extra); }

const matCeil = std(0xf3efe8, 1);
const matTrim = std(0x3b2a20, 0.6);
const matGold = std(0xc9a24a, 0.35, 0.7);
const matWood = std(0x6b4a32, 0.55);
const matGlassDark = std(0x1a2630, 0.15, 0.4);
const matWhite = std(0xf4f1ea, 0.6);

/* wall along an axis with openings. axis 'x': runs along x at z = fixed. openings: [from, to, openHeight] */
function wall(axis, fixed, a, b, openings, height, mat, opts = {}) {
  const thick = opts.thick || 0.3;
  const ops = openings.slice().sort((p, q) => p[0] - q[0]);
  const piece = (from, to, y0, y1, base) => {
    const len = to - from, hh = y1 - y0;
    if (len < 0.001 || hh < 0.001) return;
    const mid = (from + to) / 2, ym = (y0 + y1) / 2;
    if (axis === 'x') box(len, hh, thick, mat, mid, ym, fixed, null, true); else box(thick, hh, len, mat, fixed, ym, mid, null, true);
    if (base) { if (axis === 'x') box(len, 0.14, thick + 0.05, matTrim, mid, 0.07, fixed); else box(thick + 0.05, 0.14, len, matTrim, fixed, 0.07, mid); }
  };
  let cur = a;
  for (const [f, t, oh] of ops) {
    piece(cur, f, 0, height, true); piece(f, t, oh, height, false); cur = t;
    const jam = (p) => { if (axis === 'x') box(0.08, oh, thick + 0.06, matTrim, p, oh / 2, fixed); else box(thick + 0.06, oh, 0.08, matTrim, fixed, oh / 2, p); };
    jam(f); jam(t);
    if (axis === 'x') box(t - f, 0.1, thick + 0.06, matTrim, (f + t) / 2, oh, fixed); else box(thick + 0.06, 0.1, t - f, matTrim, fixed, oh, (f + t) / 2);
  }
  piece(cur, b, 0, height, true);
}

/* ============ light anchors (3 real lights follow the camera) ============ */
const anchors = [];
function anchor(x, y, z, color, inten, dist) { anchors.push({ p: P(x, y, z), color: new T.Color(color || 0xffe0b0), inten: inten || 1.4, dist: dist || 16, d: 0 }); }
const lightPool = [];
for (let i = 0; i < 3; i++) { const l = new T.PointLight(0xffffff, 0, 16, 2); scene.add(l); lightPool.push(l); }
function updateLights() {
  const cp = camera.position;
  anchors.forEach(a => { a.d = a.p.distanceToSquared(cp); });
  const near = anchors.slice().sort((p, q) => p.d - q.d);
  lightPool.forEach((l, i) => {
    const a = near[i];
    if (a) { l.position.copy(a.p); l.color.copy(a.color); l.intensity = a.inten; l.distance = a.dist; } else l.intensity = 0;
  });
}

/* base lights, sky */
scene.add(new T.HemisphereLight(0x9fa8d8, 0x4a3b36, 0.55));
const sun = new T.DirectionalLight(0xffc58a, 1.05);
sun.position.set(45, 34, 70); sun.target.position.set(0, 0, -12);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 10, far: 220 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

const skyTex = makeTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  [[0, '#1b2850'], [0.3, '#4d5a93'], [0.45, '#e8a47c'], [0.5, '#f6cf9c'], [0.52, '#7a6a6e'], [1, '#3a3036']].forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}, { clamp: true });
const sky = new T.Mesh(new T.SphereGeometry(520, 32, 16), new T.MeshBasicMaterial({ map: skyTex, side: T.BackSide, fog: false, depthWrite: false }));

const segs = {

  restaurant: { label: 'Restaurant', pts: [P(0, 1.7, -8), P(-6, 1.7, -8), P(-12, 1.7, -8), P(-19, 1.7, -8), P(-22, 1.7, -8)], focus: P(-28, 1.4, -8), kids: [] },
  pool: { label: 'Pool and spa', pts: [P(0, 1.7, -8), P(6, 1.7, -8), P(11, 1.7, -8), P(13, 1.7, -8)], focus: P(22, 0.4, -8), kids: [] },

Object.keys(segs).forEach(k => {
  const s = segs[k]; s.key = k;
  s.curve = new T.CatmullRomCurve3(s.pts, false, 'centripetal');
  s.len = s.curve.getLength();
  s.map = s.curve.getPoints(40);
  s.kids.forEach(c => { segs[c].parent = k; });
});
/* default branch when you keep scrolling forward (no choice needed) */
Object.values(segs).forEach(s => { s.def = s.kids.length === 1 ? s.kids[0] : null; });
segs.approach.def = 'corridor';

function evalSeg(key, s) {
  const sg = segs[key];
  if (s < 0 && sg.parent) return evalSeg(sg.parent, segs[sg.parent].len + s);
  if (s > sg.len && sg.def) return evalSeg(sg.def, s - sg.len);
  const u = clamp(s / sg.len);
  const pos = sg.curve.getPointAt(u), tan = sg.curve.getTangentAt(u);
  const look = pos.clone().addScaledVector(tan, 6);
  if (sg.focus) look.lerp(sg.focus, sstep(0.62, 1, u));
  return { pos, look };
}

const cur = { seg: 'approach', sT: 0, sC: 0 };
function normalize() {
  for (let guard = 0; guard < 8; guard++) {
    const sg = segs[cur.seg];
    if (cur.sT < 0 && sg.parent) { const pl = segs[sg.parent].len; cur.seg = sg.parent; cur.sT += pl; cur.sC += pl; continue; }
    if (cur.sT > sg.len && sg.def) { cur.seg = sg.def; cur.sT -= sg.len; cur.sC -= sg.len; continue; }
    break;
  }
  const sg = segs[cur.seg];
  if (!sg.parent) cur.sT = Math.max(0, cur.sT);
  if (!sg.def) cur.sT = Math.min(sg.len, cur.sT);
}
function move(d) { cur.sT += d; normalize(); }
/* jump onto a branch; shift = true when leaving the end of the current segment */
function go(k, shift) {
  if (shift) { const len = segs[cur.seg].len; cur.sT -= len; cur.sC -= len; }
  cur.seg = k;
  if (cur.sT < 0.2) cur.sT = 0.2;
}

/* ============ input: scrolling + arrow keys ============ */
addEventListener('wheel', e => {
  e.preventDefault();
  const d = clamp(e.deltaY * (e.deltaMode === 1 ? 16 : 1), -240, 240);
  move(d * 0.12);
}, { passive: false });
let lastY = null;
addEventListener('touchstart', e => { lastY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => { e.preventDefault(); const y = e.touches[0].clientY; if (lastY !== null) move((lastY - y) * 0.07); lastY = y; }, { passive: false });
addEventListener('keydown', e => {
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); move(4); }
  if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); move(-4); }
});
/* left / right arrows pick a branch at a fork, no menu */
addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const left = e.key === 'ArrowLeft';
  const sg = segs[cur.seg];
  if (cur.seg === 'approach' && cur.sC >= sg.len - 3) go(left ? 'restaurant' : 'pool', false);
  else if (cur.seg === 'corridor' && cur.sC > -3 && cur.sC < 3) go(left ? 'restaurant' : 'pool', false);
  else if (cur.seg === 'corridor' && cur.sC >= sg.len - 3) go(left ? 'guest' : 'lounge', true);
});

/* ============ HUD ============ */
const zoneEl = document.getElementById('zone'), hintEl = document.getElementById('hint');
const mapC = document.getElementById('map'), mapG = mapC.getContext('2d');
function zoneAt(x, z) {
  if (z > 0.5) return 'Outside';
  if (z > -16) return x < -10 ? 'Restaurant' : x > 10 ? 'Pool and spa' : 'Lobby';
  if (z > -22) return 'Corridor';
  return x < -8 ? 'Guest room' : x > 8 ? 'Rooftop lounge' : 'Corridor';
}
let lastZone = '';
function updateHud() {
  const z = zoneAt(camera.position.x, camera.position.z);
  if (z !== lastZone) { lastZone = z; zoneEl.textContent = z; }
  const sg = segs[cur.seg], atEnd = cur.sC >= sg.len - 1.0;
  let msg = '';
  if (cur.seg === 'approach' && cur.sC < 4) msg = 'Scroll, swipe, or use the arrow keys to walk in';
  else if (cur.seg === 'approach' && cur.sC >= sg.len - 3) msg = '\u2190 Restaurant     Scroll on: Guest rooms     \u2192 Pool and spa';
  else if (cur.seg === 'corridor' && cur.sC > -3 && cur.sC < 3) msg = '\u2190 Restaurant     Scroll on: Guest rooms     \u2192 Pool and spa';
  else if (cur.seg === 'corridor' && cur.sC >= sg.len - 3) msg = '\u2190 Guest room     \u2192 Rooftop lounge';
  else if (sg.kids.length === 0 && atEnd) msg = 'Dead end. Scroll back to try another route';

const rooms = [[-10, -16, 10, 0, '#6d6355'], [-30, -16, -10, 0, '#5a4a3a'], [10, -16, 30, 0, '#3f6d7a'], [-30, -22, 30, -16, '#4a4f59'], [-30, -34, -8, -22, '#5b5646'], [8, -34, 30, -22, '#6a4f3d'], [-8, -34, 8, -22, '#35373c']];
function drawMap() {
  const W = mapC.width, Hh = mapC.height, sx = x => (x + 34) / 68 * W, sy = z => (8 - z) / 46 * Hh;
  mapG.clearRect(0, 0, W, Hh);
  rooms.forEach(r => { mapG.fillStyle = r[4]; mapG.fillRect(sx(r[0]) + 1, sy(r[3]) + 1, sx(r[2]) - sx(r[0]) - 2, sy(r[1]) - sy(r[3]) - 2); });

}

/* ============ main loop ============ */
const lookNow = new T.Vector3(); let first = true, prev = performance.now(), fc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; tClock += dt;
  cur.sC += (cur.sT - cur.sC) * (1 - Math.exp(-dt * 4.5));
  const pose = evalSeg(cur.seg, cur.sC);
  camera.position.copy(pose.pos);
  if (first) { lookNow.copy(pose.look); first = false; } else lookNow.lerp(pose.look, 1 - Math.exp(-dt * 5));
  camera.lookAt(lookNow);
  sky.position.copy(camera.position);

}
